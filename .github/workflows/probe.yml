# Temporary: checks whether Duolingo shares Guidebook key phrases. Delete afterwards.
name: Probe guidebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Look at the course data
        env:
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
        run: python3 scripts/probe_guidebook.py

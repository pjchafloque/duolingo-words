# Pulls your learned words from Duolingo and publishes the page.
# Runs every 6 hours, when you press "Run workflow" in the Actions tab,
# and whenever you change something in the repo (like data/overrides.json).
name: Sync words

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sync-words
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.sync.outputs.ok }}
      message: ${{ steps.sync.outputs.message }}
    steps:
      - uses: actions/checkout@v7

      - name: Install eSpeak NG (writes the pronunciations)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng > /dev/null
          espeak-ng --version

      - name: Get words from Duolingo
        id: sync
        env:
          DUOLINGO_JWT: ${{ secrets.DUOLINGO_JWT }}
        run: python3 scripts/sync.py

      - name: Save changes
        if: ${{ !cancelled() }}
        run: |
          if [ -n "$(git status --porcelain -- data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -q -m "Update words"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          else
            echo "Nothing new to save."
          fi

  publish:
    needs: sync
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Build the site
        env:
          SYNC_OK: ${{ needs.sync.outputs.ok }}
          SYNC_MESSAGE: ${{ needs.sync.outputs.message }}
          SYNC_RESULT: ${{ needs.sync.result }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p _site
          cp -r index.html tools.html fonts data _site/
          python3 scripts/status.py _site/status.json

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

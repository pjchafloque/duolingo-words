    return `<span class="fb ${a.ok ? "ok" : "bad"}">${esc(msg)}${why ? ` ${esc(why.charAt(0).toUpperCase() + why.slice(1))}.` : ""}</span>`;
  }
  function qHTML(item, q, i, a) {
    if (item.kind === "type") {
      const [sentence, hint] = q;
      const [before, ...rest] = sentence.split("___");
      const cls = a ? (a.ok ? " ok" : a.almost ? " almost" : " bad") : "";
      return `<li class="q" data-i="${i}"><span lang="pt">${esc(before)}` +
        `<input class="blank${cls}" data-set="${esc(item.id)}" data-i="${i}" value="${esc(a ? a.v : "")}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="${esc(hint)}">` +
        `${esc(rest.join("___"))}</span> <span class="hint">(${esc(hint)})</span>${fbHTML(item, q, a)}</li>`;
    }
    const [sentence, opts, correct] = q;
    let shown;
    if (a) {
      const fill = opts[correct].split(" / ");
      const parts = sentence.split("___");
      const said = parts.map((b, j) => b + (j < parts.length - 1 ? (fill[j] || fill[0]) : "")).join("");
      shown = `<span class="say" lang="pt" data-say="${esc(said)}">` +
        parts.map((b, j) => esc(b) + (j < parts.length - 1 ? `<b class="filled">${esc(fill[j] || fill[0])}</b>` : "")).join("") + `</span>`;
    } else {
      shown = `<span lang="pt">${esc(sentence).replace(/___/g, '<span class="gap">____</span>')}</span>`;
    }
    const opt = (o, j) => `<button type="button" class="opt${a ? (j === correct ? " ok" : j === a.c ? " bad" : "") : ""}" data-set="${esc(item.id)}" data-i="${i}" data-c="${j}"${a ? " disabled" : ""}>${esc(o)}</button>`;
    return `<li class="q" data-i="${i}">${shown} <span class="opts">${opts.map(opt).join("")}</span>${fbHTML(item, q, a)}</li>`;
  }
  function scoreText(item) {
    const ans = aula.answers[item.id] || {};
    return `${Object.values(ans).filter((a) => a.ok).length}/${item.items.length}`;
  }
  function setHTML(item) {
    const ans = aula.answers[item.id] || {};
    return `<section class="group card set" data-set="${esc(item.id)}">${headHTML(item, `<span class="score">${esc(scoreText(item))}</span>`)}` +
      (item.use ? `<p class="use">${md(item.use)}</p>` : "") +
      `<ol class="qs">${item.items.map((q, i) => qHTML(item, q, i, ans[i])).join("")}</ol>` +
      `<p class="set-foot"><button type="button" class="link" data-reset="${esc(item.id)}">${esc(t().reset)}</button></p></section>`;
  }
  function refreshScore(item) {
    const el = document.querySelector(`.set[data-set="${CSS.escape(item.id)}"] .score`);
    if (el) el.textContent = scoreText(item);
  }
  function checkTyped(inp) {
    const id = inp.dataset.set, i = Number(inp.dataset.i);
    const item = findItem(id);
    if (!item || !inp.value.trim()) return;
    const q = item.items[i];
    const g = grade(inp.value, q[2]);
    (aula.answers[id] = aula.answers[id] || {})[i] = { v: inp.value, ok: g.ok, almost: !!g.almost };
    const li = inp.closest("li.q");
    li.outerHTML = qHTML(item, q, i, aula.answers[id][i]);
    refreshScore(item);
    const set = document.querySelector(`.set[data-set="${CSS.escape(id)}"]`);
    if (!set) return;
    const blanks = [...set.querySelectorAll("input.blank")];
    const next = g.ok ? blanks.slice(i + 1).find((b) => !b.classList.contains("ok")) : blanks[i];
    if (next) next.focus();
  }
  function answerChoice(btn) {
    const id = btn.dataset.set, i = Number(btn.dataset.i), c = Number(btn.dataset.c);
    const item = findItem(id);
    if (!item) return;
    const q = item.items[i];
    (aula.answers[id] = aula.answers[id] || {})[i] = { c, ok: c === q[2] };
    btn.closest("li.q").outerHTML = qHTML(item, q, i, aula.answers[id][i]);
    refreshScore(item);
  }

  // ---- Conjugation drill ----
  const tenseName = (id) => (aula.tenses.find((x) => x.id === id) || { name: id }).name;
  function newDrill() {
    let pool = aula.verbs.filter((v) => !v.v.endsWith("-se"));
    if (aula.lesson) {
      const own = pool.filter((v) => (v.lessons || []).includes(aula.lesson));
      if (own.length) pool = own;
    }
    const tenses = aula.drillTenses.filter((x) => DRILL_TENSES.includes(x));
    aula.drill = null;
    if (!tenses.length || !pool.length) return;
    for (let tries = 0; tries < 500; tries++) {
      const v = pool[Math.floor(Math.random() * pool.length)];
      const tense = tenses[Math.floor(Math.random() * tenses.length)];
      const p = Math.floor(Math.random() * 4);
      if (!v.t[tense]) continue;
      if (aula.drillIrr && !(v.x && v.x[tense] && v.x[tense][p])) continue;
      aula.drill = { v: v.v, tense, p, typed: "", done: null };
      return;
    }
  }
  function drillHTML(item) {
    const s = t();
    if (!aula.drill) newDrill();
    const d = aula.drill;
    const toggles = DRILL_TENSES.map((id) =>
      `<button type="button" class="toggle" data-dt="${id}" aria-pressed="${aula.drillTenses.includes(id)}" lang="pt">${esc(tenseName(id))}</button>`).join("");
    let h = `<section class="group card drill">${headHTML(item, `<span class="score">${aula.score.ok}/${aula.score.n}</span>`)}` +
      (item.use ? `<p class="use">${md(item.use)}</p>` : "") +
      `<p class="dt-row">${toggles}<button type="button" class="toggle" data-dirr aria-pressed="${aula.drillIrr}">${esc(s.onlyIrr)}</button></p>`;
    if (!d) return h + `<p class="message">${esc(aula.drillTenses.length ? s.drillNoIrr : s.drillEmpty)}</p></section>`;
    const v = aula.verbMap.get(d.v);
    const answer = v.t[d.tense][d.p];
    h += `<p class="dq"><span class="pt say" lang="pt" data-say="${esc(v.v)}">${esc(v.v)}</span> <span class="ves">(${esc(v.es)})</span> · <span lang="pt">${esc(tenseName(d.tense))}</span> · <b lang="pt">${esc(aula.persons[d.p] || PERSON_SHORT[d.p])}</b></p>` +
      `<p class="da"><input class="blank wide${d.done ? (d.done.ok ? " ok" : " bad") : ""}" id="drillIn" value="${esc(d.typed)}"${d.done ? " readonly" : ""} autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" lang="pt" aria-label="${esc(s.drillLabel)}"> ` +
      `<button type="button" class="opt" data-drill="${d.done ? "next" : "check"}">${esc(d.done ? s.next : s.check)}</button></p>`;
    if (d.done) {
      const { pron } = pronOf(answer);
      h += `<p class="fb ${d.done.ok ? "ok" : "bad"}">${esc(d.done.ok ? s.right : d.done.almost ? s.almostLead : s.wasLead)} ` +
        `<span class="pt say" lang="pt" data-say="${esc(answer)}">${esc(answer)}</span>${pron ? ` <span class="fp">${esc(pron)}</span>` : ""}</p>`;
    }
    return h + `</section>`;
  }
  function redrawDrill(focus) {
    const el = document.querySelector(".drill");
    const item = findItem("conjugar");
    if (!el || !item) return;
    el.outerHTML = drillHTML(item);
    if (focus) { const inp = $("#drillIn"); if (inp) inp.focus(); }
  }
  function checkDrill() {
    const d = aula.drill;
    const inp = $("#drillIn");
    if (!d || d.done || !inp || !inp.value.trim()) return;
    const v = aula.verbMap.get(d.v);
    d.typed = inp.value;
    d.done = grade(inp.value, v.t[d.tense][d.p]);
    aula.score.n++;
    if (d.done.ok) aula.score.ok++;
    redrawDrill(false);
    const next = document.querySelector('.drill [data-drill="next"]');
    if (next) next.focus();
  }
  function nextDrill() { newDrill(); redrawDrill(true); }

  // ---- Verb lookup ----
  function verbTableHTML(v) {
    const s = t();
    let h = `<div class="vtable"><span class="vh"></span>` + PERSON_SHORT.map((p) => `<span class="vh">${esc(p)}</span>`).join("");
    for (const tn of aula.tenses) {
      if (!v.t[tn.id]) continue;
      const card = aula.tenseCard[tn.id];
      h += `<span class="tn" lang="pt">${card ? `<button type="button" class="link" data-jump="${esc(card)}">${esc(tn.name)}</button>` : esc(tn.name)}</span>`;
      for (let p = 0; p < 4; p++) h += cellHTML(v, tn.id, p, "irr");
    }
    h += `</div>`;
    const ger = pronOf(v.ger), part = pronOf(v.part);
    h += `<p class="vextra"><span class="lbl" lang="pt">Gerúndio</span> <span class="form say" lang="pt" data-say="${esc(v.ger)}">${esc(v.ger)}</span>${ger.pron ? ` <span class="fp">${esc(ger.pron)}</span>` : ""}` +
      ` · <span class="lbl" lang="pt">Particípio</span> <span class="form say" lang="pt" data-say="${esc(v.part)}">${v.xp ? `<b class="red">${esc(v.part)}</b>` : esc(v.part)}</span>${part.pron ? ` <span class="fp">${esc(part.pron)}</span>` : ""}</p>`;
    if (v.note) h += `<p class="ojo">${md(v.note)}</p>`;
    if (v.lessons && v.lessons.length) h += `<p class="gnote">${esc(s.seenIn)}: ${tagsHTML(v.lessons)}</p>`;
    return h;
  }
  function lookupHTML() {
    const s = t();
    const v = aula.verbMap.get(aula.verb) || aula.verbs[0];
    if (!v) return "";
    const sorted = [...aula.verbs].sort((a, b) => a.v.localeCompare(b.v, "pt"));
    return `<section class="group card lookup" id="i-buscar"><h2><span class="when" lang="pt">${esc(s.lookupTitle)}</span><span class="tags">${esc(s.verbCount(aula.verbs.length))}</span></h2>` +
      `<p class="lookup-bar"><label class="vsearch"><span class="sr">${esc(s.lookupLabel)}</span>` +
      `<input id="verbQ" list="verbList" value="${esc(v.v)}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="pt"></label> <span class="ves" id="verbEs">${esc(v.es)}</span></p>` +
      `<datalist id="verbList">${sorted.map((x) => `<option value="${esc(x.v)}">${esc(x.es)}</option>`).join("")}</datalist>` +
      `<div id="lookupOut">${verbTableHTML(v)}</div>` +
      `<details class="allverbs"><summary>${esc(s.allVerbs(aula.verbs.length))}</summary>` +
      `<p class="chips">${sorted.map((x) => `<button type="button" class="chip${x.irr ? " irr" : ""}" data-verb="${esc(x.v)}" lang="pt"${x.v === v.v ? " aria-current" : ""}>${esc(x.v)}</button>`).join("")}</p>` +
      `<p class="gnote">${esc(s.redIrr)}</p></details></section>`;
  }
  function verbHitsHTML(f) {
    const s = t();
    const vs = aula.verbs.filter((v) => (!f.lesson || (v.lessons || []).includes(f.lesson)) &&
      (!f.q || hit(v.v + " " + v.es, f.q) || Object.values(v.t).some((fs) => fs.some((x) => fold(x) === f.q))));
    if (!vs.length) return "";
    vs.sort((a, b) => a.v.localeCompare(b.v, "pt"));
    return `<section class="group card"><h2><span class="when" lang="pt">${esc(s.lookupTitle)}</span><span class="tags">${esc(s.verbCount(vs.length))}</span></h2>` +
      `<p class="chips">${vs.map((v) => `<button type="button" class="chip${v.irr ? " irr" : ""}" data-verb="${esc(v.v)}" lang="pt">${esc(v.v)}</button>`).join("")}</p></section>`;
  }
  function updateLookup() {
    const v = aula.verbMap.get(aula.verb);
    const out = $("#lookupOut");
    if (!out || !v) return;
    out.innerHTML = verbTableHTML(v);
    $("#verbEs").textContent = v.es;
    const inp = $("#verbQ");
    if (inp && document.activeElement !== inp) inp.value = v.v;
    for (const c of document.querySelectorAll(".lookup .chip[data-verb]")) c.toggleAttribute("aria-current", c.dataset.verb === v.v);
  }
  function lookupInput(value, final) {
    const k = norm(value);
    if (!k) return;
    let v = aula.verbs.find((x) => norm(x.v) === k);
    if (!v && final) v = aula.verbs.find((x) => fold(x.v) === fold(k)) || aula.verbs.find((x) => fold(x.v).startsWith(fold(k)));
    if (!v || (v.v === aula.verb && !final)) return;
    aula.verb = v.v;
    store.set("aulaVerb", v.v);
    updateLookup();
  }
  function goVerb(name) {
    if (!aula.verbMap.has(name)) return;
    aula.verb = name;
    store.set("aulaVerb", name);
    if (aulaFilter().cross || aula.sec !== "verbos") {
      aula.lesson = ""; store.set("aulaLesson", "");
      state.q = ""; $("#q").value = "";
      aula.sec = "verbos"; store.set("aulaSec", "verbos");
      syncHash();
      render();
    } else {
      updateLookup();
    }
    const el = document.getElementById("i-buscar");
    if (el) el.scrollIntoView({ block: "start" });
  }

  // ---- The whole class page ----
  function aulaFilter() {
    const q = fold(state.q.trim());
    return { q, lesson: aula.lesson, cross: !!(q || aula.lesson) };
  }
  function sectionHTML(sec, f) {
    let h = "";
    if (sec.id === "verbos") h += f.cross ? verbHitsHTML(f) : lookupHTML();
    for (const item of sec.items) {
      if (item.drill) { if (!f.cross) h += drillHTML(item); continue; }
      if (item.prompts) { h += conversaHTML(item, f); continue; }
      if (f.lesson && !(item.lessons || []).includes(f.lesson)) continue;
      if (item.kind) { if (!f.q || textOf(item).includes(f.q)) h += setHTML(item); continue; }
      if (item.words) { h += wordGroupHTML(item, f); continue; }
      if (f.q && !textOf(item).includes(f.q)) continue;
      h += `<section class="group card">${headHTML(item)}${blocksHTML(item)}</section>`;
    }
    return h;
  }
  function renderLessonSelect() {
    const sel = $("#lesson");
    const key = `${lang}:${aula.lessons.size}`;
    if (sel.dataset.built !== key) {
      const s = t();
      let h = `<option value="">${esc(s.allLessons)}</option>`;
      for (const c of aula.data.courses || []) {
        const ls = [...aula.lessons.values()].filter((l) => l.course === c.id);
        if (ls.length) h += `<optgroup label="${esc(c.name)}">${ls.map((l) => `<option value="${esc(l.id)}">${esc(l.name)}</option>`).join("")}</optgroup>`;
      }
      sel.innerHTML = h;
      sel.dataset.built = key;
    }
    sel.value = aula.lesson;
    sel.classList.toggle("on", !!aula.lesson);
  }
  function classWords() {
    const out = [];
    for (const sec of aula.data.sections) for (const it of sec.items) {
      for (const r of it.words || []) out.push(r[0]);
      for (const b of it.blocks || []) for (const r of b.words || []) out.push(r[0]);
    }
    return out.map((text) => ({ text, ...pronOf(text) })).filter((w) => w.pron);
  }
  function renderAula() {
    const s = t();
    const list = $("#list");
    $("#status").hidden = true;
    $("#demo").hidden = true;
    if (aula.status !== "ready") {
      if (aula.status === "idle") loadAula();
      $("#summary").textContent = " ";
      $("#secs").innerHTML = "";
      $("#legend").hidden = true;
      list.innerHTML = `<p class="message">${esc(aula.status === "error" ? s.aulaError : s.loading)}</p>`;
      return;
    }
    const d = aula.data;
    const f = aulaFilter();
    renderLessonSelect();
    const vocab = (d.sections.find((x) => x.id === "vocabulario") || { items: [] }).items;
    const words = vocab.flatMap((it) => it.words || []);
    const topics = d.sections.filter((x) => x.id === "verbos" || x.id === "gramatica").reduce((n, x) => n + x.items.length, 0);
    const inDuo = words.filter((r) => duoOf(r[0])).length;
    $("#summary").textContent = s.aulaSummary(words.length, aula.verbs.length, topics) + (inDuo ? s.aulaDuo(inDuo) : "");

    let html = "";
    const present = new Set();
    if (f.lesson) {
      const l = aula.lessons.get(f.lesson) || { name: f.lesson };
      html += `<p class="lesson-q"><b>${esc(l.name)}</b>` +
        (l.q ? ` · <span class="pt say" lang="pt" data-say="${esc(l.q)}">${esc(l.q)}</span>` : "") +
        ` · <button type="button" class="link" data-lesson="${esc(f.lesson)}">${esc(s.clearLesson)}</button></p>`;
    }
    if (f.cross) {
      let body = "";
      for (const sec of d.sections) {
        const inner = sectionHTML(sec, f);
        if (!inner) continue;
        present.add(sec.id);
        body += `<section class="aula-sec" id="sec-${esc(sec.id)}"><h2 class="sec-head" lang="pt">${esc(sec.name)}</h2>${inner}</section>`;
      }
      html += body || `<p class="message">${esc(f.q ? s.noMatchAula(state.q.trim()) : s.lessonEmpty)}</p>`;
    } else {
      const sec = d.sections.find((x) => x.id === aula.sec) || d.sections[0];
      html += (sec.intro ? `<p class="intro">${md(sec.intro)}</p>` : "") + sectionHTML(sec, f);
    }
    $("#secs").innerHTML = d.sections.map((sec) =>
      `<button type="button" data-sec="${esc(sec.id)}" lang="pt" aria-current="${!f.cross && sec.id === aula.sec}"${f.cross && !present.has(sec.id) ? ' class="dim"' : ""}>${esc(sec.name)}</button>`).join("");
    list.innerHTML = html;
    renderLegend(classWords());
  }
  function setLesson(id) {
    aula.lesson = id && id !== aula.lesson ? id : "";
    store.set("aulaLesson", aula.lesson);
    aula.drill = null;
    render();
    const top = $("#tools").offsetTop;
    if (window.scrollY > top) window.scrollTo({ top });
  }

  // ---- Clicks and typing in the class page ----
  function aulaClick(e) {
    const tg = e.target;
    const tape = tg.closest(".tape");
    if (tape) {
      revealed.add(tape.dataset.k);
      const box = tape.closest(".covered");
      if (box) box.classList.remove("covered");
      return;
    }
    const les = tg.closest("[data-lesson]");
    if (les) { setLesson(les.dataset.lesson); return; }
    const vb = tg.closest("[data-verb]");
    if (vb) { goVerb(vb.dataset.verb); return; }
    const jump = tg.closest("[data-jump]");
    if (jump) { const el = document.getElementById("i-" + jump.dataset.jump); if (el) el.scrollIntoView({ block: "start" }); return; }
    const rev = tg.closest("[data-reveal]");
    if (rev) {
      const k = rev.dataset.reveal;
      if (aula.openPrompts.has(k)) aula.openPrompts.delete(k); else aula.openPrompts.add(k);
      const open = aula.openPrompts.has(k);
      rev.setAttribute("aria-expanded", String(open));
      rev.textContent = open ? t().hideEx : t().showEx;
      const pa = rev.parentElement.querySelector(".pa");
      if (pa) pa.hidden = !open;
      return;
    }
    const opt = tg.closest(".opt[data-c]");
    if (opt) { if (!opt.disabled) answerChoice(opt); return; }
    const dr = tg.closest("[data-drill]");
    if (dr) { if (dr.dataset.drill === "check") checkDrill(); else nextDrill(); return; }
    const dt = tg.closest("[data-dt]");
    if (dt) {
      const id = dt.dataset.dt;
      aula.drillTenses = aula.drillTenses.includes(id) ? aula.drillTenses.filter((x) => x !== id) : [...aula.drillTenses, id];
      store.set("drillTenses", aula.drillTenses);
      nextDrill();
      return;
    }
    if (tg.closest("[data-dirr]")) { aula.drillIrr = !aula.drillIrr; store.set("drillIrr", aula.drillIrr); nextDrill(); return; }
    const reset = tg.closest("[data-reset]");
    if (reset) {
      const item = findItem(reset.dataset.reset);
      delete aula.answers[reset.dataset.reset];
      const el = reset.closest(".set");
      if (item && el) el.outerHTML = setHTML(item);
      return;
    }
    if (tg.closest("input, select, summary, a")) return;
    const sayEl = tg.closest("[data-say]");
    if (!sayEl) return;
    if (sayEl.classList.contains("entry")) {
      if (tg.closest(".play, .word, .pron")) sayText(sayEl.dataset.say, sayEl);
      return;
    }
    const host = sayEl.classList.contains("play") ? (sayEl.closest(".prompt") || sayEl) : sayEl;
    sayText(sayEl.dataset.say, host);
  }
  $("#list").addEventListener("keydown", (e) => {
    if (!inAula() || e.key !== "Enter") return;
    const inp = e.target.closest && e.target.closest("input");
    if (!inp) return;
    if (inp.id === "drillIn") { e.preventDefault(); if (aula.drill && aula.drill.done) nextDrill(); else checkDrill(); return; }
    if (inp.id === "verbQ") { e.preventDefault(); lookupInput(inp.value, true); inp.blur(); return; }
    if (inp.classList.contains("blank")) { e.preventDefault(); checkTyped(inp); }
  });
  $("#list").addEventListener("input", (e) => {
    if (!inAula()) return;
    if (e.target.id === "verbQ") lookupInput(e.target.value, false);
    else if (e.target.id === "drillIn" && aula.drill) aula.drill.typed = e.target.value;
  });
  $("#list").addEventListener("change", (e) => {
    if (inAula() && e.target.id === "verbQ") lookupInput(e.target.value, true);
  });
  $("#secs").addEventListener("click", (e) => {
    const g = e.target.closest("[data-group]");
    if (g) { // a situation in the important sentences: jump to it
      const el = document.getElementById("g-" + g.dataset.group);
      if (el) el.scrollIntoView({ block: "start" });
      return;
    }
    const b = e.target.closest("[data-sec]");
    if (!b || aula.status !== "ready") return;
    const id = b.dataset.sec;
    if (aulaFilter().cross) {
      const el = document.getElementById("sec-" + id);
      if (el) { el.scrollIntoView({ block: "start" }); return; }
      aula.lesson = ""; store.set("aulaLesson", "");
      state.q = ""; $("#q").value = "";
    }
    aula.sec = id;
    store.set("aulaSec", id);
    syncHash();
    render();
    const top = $("#tools").offsetTop;
    if (window.scrollY > top) window.scrollTo({ top });
  });
  $("#lesson").addEventListener("change", (e) => setLesson(e.target.value));

  // ===== Important sentences ("Frases importantes"), a second part of the French notebook =====
  // data/frases.json is written by hand: sentences by situation, a star on the
  // essential ones and a note on when to use each. data/guidebook.json has the key
  // phrases the sync saves from each Duolingo unit's Guidebook, with Duolingo's
  // recording, and data/frases-pron.json the readings scripts/frases.py puts
  // together from your own words.
  const frases = { status: "idle", groups: [], duo: new Map(), pron: {}, shown: [] };
  function inFrases() {
    const c = course();
    return !!c && c.learning === "fr" && viewOf(c) === "frases";
  }
  // A sentence's key everywhere (data files, your fixes): plain spaces, straight apostrophes.
  const sentKey = (s) => String(s ?? "").normalize("NFC").replace(/[   ]/g, " ").replace(/’/g, "'").replace(/\s+/g, " ").trim();
  const sentMatch = (s) => sentKey(s).toLowerCase();
  // French puts a space before ? and !; this one never breaks the line.
  const frTypo = (s) => s.replace(/ ([?!:;»])/g, " $1").replace(/« /g, "« ");

  function loadFrases() {
    if (frases.status === "loading" || frases.status === "ready") return;
    frases.status = "loading";
    Promise.all([
      getJSON("data/frases.json"),
      getJSON("data/guidebook.json").catch(() => null),
      getJSON("data/frases-pron.json").catch(() => null),
    ]).then(([d, g, p]) => {
      frases.groups = (((d && d.fr) || {}).groups || []).filter((x) => x && Array.isArray(x.sentences));
      frases.duo = new Map();
      for (const [key, entry] of Object.entries(g || {})) {
        if (!key.startsWith("fr-") || !entry || !Array.isArray(entry.units)) continue;
        for (const u of entry.units) for (const ph of u.phrases || []) {
          if (ph && typeof ph.fr === "string" && !frases.duo.has(sentMatch(ph.fr))) {
            frases.duo.set(sentMatch(ph.fr), { ...ph, section: u.section || 0, unit: u.unit || 0 });
          }
        }
      }
      frases.pron = (p && p.fr) || {};
      frases.status = "ready";
      reconcilePending();
    }).catch(() => { frases.status = "error"; })
      .then(() => { if (inFrases()) render(); });
  }

  // Your groups first, then key phrases from new units that aren't in a group yet.
  function frasesGroups() {
    const s = t();
    const seen = new Set();
    const out = frases.groups.map((g) => ({
      id: g.id, title: g.title,
      items: g.sentences.filter((x) => x && typeof x.fr === "string" && x.fr.trim()).map((x) => {
        const k = sentMatch(x.fr);
        seen.add(k);
        const duo = frases.duo.get(k) || null;
        return { fr: sentKey(x.fr), es: x.es || (duo && duo.es) || "", star: !!x.star, use: x.use || "", duo };
      }),
    }));
    const fresh = [];
    for (const [k, duo] of frases.duo) {
      if (!seen.has(k)) fresh.push({ fr: sentKey(duo.fr), es: duo.es || "", star: false, use: "", duo });
    }
    if (fresh.length) out.push({ id: "nuevas", title: s.newDuo, intro: s.newDuoIntro, items: fresh });
    return out.filter((g) => g.items.length);
  }
  function sentPron(text) {
    const mine = pendingPron("fr", text); // a fix you just saved that isn't published yet
    if (mine) return mine;
    const p = frases.pron[text];
    return p && p[0] ? p[0] : "";
  }
  function sentHTML(it, i, c) {
    const s = t();
    const k = it.fr;
    const coverFr = state.quiz && state.cover === "fr" && !revealed.has("f:" + k);
    const coverEs = state.quiz && state.cover !== "fr" && !revealed.has("e:" + k);
    return `<li class="entry sent" data-i="${i}">` +
      `<button type="button" class="play" aria-label="${esc(s.play(k))}">${SPEAKER}</button>` +
      `<span class="orig${coverFr ? " covered" : ""}">` +
        (it.star ? `<span class="star" title="${esc(s.essential)}" aria-label="${esc(s.essential)}">★</span>` : "") +
        `<button type="button" class="tape" data-k="${esc("f:" + k)}" aria-label="${esc(s.revealSent)}"></button>` +
        `<span class="word" lang="${esc(c.learning)}">${esc(frTypo(k))}</span>` +
        `<span class="pron${pronExtra(c.learning, k)}"${pronAttrs(k)}>${esc(sentPron(k))}</span>` +
      `</span>` +
      `<span class="meaning${coverEs ? " covered" : ""}">` +
        `<button type="button" class="tape" data-k="${esc("e:" + k)}" aria-label="${esc(s.reveal(k))}"></button>` +
        `<span class="text" lang="${esc(c.from)}">${esc(it.es)}</span>` +
        (it.use ? `<span class="note">${esc(frTypo(it.use))}</span>` : "") + // "et vous ?" keeps its ? on the line
        (it.duo ? `<span class="src">${esc(s.fromDuo(it.duo.section, it.duo.unit))}</span>` : "") +
      `</span></li>`;
  }
  function renderFrases() {
    const s = t();
    const c = course();
    const list = $("#list");
    $("#status").hidden = true;
    $("#demo").hidden = true;
    renderLegend(c.words || []);
    if (frases.status !== "ready") {
      if (frases.status === "idle") loadFrases();
      $("#summary").textContent = " ";
      $("#secs").innerHTML = "";
      list.innerHTML = `<p class="message">${esc(frases.status === "error" ? s.frasesError : s.frasesLoading)}</p>`;
      return;
    }
    const groups = frasesGroups();
    const all = groups.flatMap((g) => g.items);
    $("#summary").textContent = s.frasesSummary(all.length, all.filter((x) => x.star).length, all.filter((x) => x.duo).length);
    const q = fold(state.q.trim());
    const keep = (it) => (!state.stars || it.star) && (!q || [it.fr, it.es, it.use, sentPron(it.fr)].some((x) => fold(x).includes(q)));
    frases.shown = [];
    const present = new Set();
    let html = "";
    for (const g of groups) {
      const items = g.items.filter(keep);
      if (!items.length) continue;
      present.add(g.id);
      html += `<section class="group" id="g-${esc(g.id)}"><h2><span class="when">${esc(g.title)}</span><span class="count">${esc(s.sentCount(items.length))}</span></h2>` +
        (g.intro ? `<p class="intro">${esc(g.intro)}</p>` : "") + `<ol class="entries">`;
      for (const it of items) { html += sentHTML(it, frases.shown.length, c); frases.shown.push(it); }
      html += `</ol></section>`;
    }
    $("#secs").innerHTML = groups.map((g) =>
      `<button type="button" data-group="${esc(g.id)}"${present.has(g.id) ? "" : ' class="dim"'}>${esc(g.title)}</button>`).join("");
    list.innerHTML = html || `<p class="message">${esc(q ? s.noMatchSent(state.q.trim()) : s.noSent)}</p>`;
  }
  // Duolingo's recording for its key phrases, the browser's French voice for the rest.
  function frasesClick(e) {
    const tape = e.target.closest(".tape");
    if (tape) {
      revealed.add(tape.dataset.k);
      const box = tape.closest(".covered");
      if (box) box.classList.remove("covered");
      return;
    }
    const row = e.target.closest(".entry.sent");
    const it = row && frases.shown[Number(row.dataset.i)];
    if (it && e.target.closest(".play, .word, .pron")) play({ text: it.fr, audio: it.duo && it.duo.audio ? it.duo.audio : null }, row);
  }

  // ===== Fixing a pronunciation from the page =====
  // The page is static, so it can't check a password. What it can do is write
  // to data/overrides.json in your GitHub repo, and GitHub only lets you do
  // that. The key is a fine-grained GitHub token that only opens this repo:
  // it's kept in this browser (localStorage) and only ever sent to
  // api.github.com. Without it there's no Editar button, and GitHub turns down
  // any write that doesn't carry it. Each save is a commit, which runs the sync
  // and republishes the page a minute or two later.
  const FILE = "contents/data/overrides.json";
  const PENDING_MS = 30 * 60 * 1000;
  const loadPending = () => {
    const p = store.get("pendingPron", {});
    return p && typeof p === "object" && !Array.isArray(p) ? p : {};
  };
  const edits = {
    token: store.get("ghToken", ""),
    pending: loadPending(), // fixes saved on GitHub that the published page may not show yet
    queue: new Map(), // waiting to be saved
    busy: new Set(), // being saved right now
  };
  const editId = (code, key) => code + "\u0000" + key;
  const savePending = () => store.set("pendingPron", edits.pending);

  function repoName() {
    if (state.status && state.status.repo) return state.status.repo;
    const host = location.hostname.match(/^([\w-]+)\.github\.io$/i);
    const first = location.pathname.split("/").filter(Boolean)[0];
    return host && first && !/\.html?$/i.test(first) ? `${host[1]}/${first}` : "";
  }
  function tokenUrl() {
    const repo = repoName().split("/")[1] || "duolingo-words";
    const q = new URLSearchParams({
      name: "Carnet: editar pronunciaciones",
      description: `Lets the ${repo} page save pronunciation fixes to data/overrides.json.`,
      expires_in: "none",
      contents: "write",
    });
    return "https://github.com/settings/personal-access-tokens/new?" + q;
  }

  // ---- What a blue text shows while a fix is on its way ----
  function pendingPron(code, key) {
    const p = (edits.pending[code] || {})[key];
    return p && p.pron ? p.pron : "";
  }
  function pronExtra(code, key) {
    const id = editId(code, key);
    if (edits.queue.has(id) || edits.busy.has(id)) return " saving";
    const p = (edits.pending[code] || {})[key];
    return p && !p.pron ? " pending" : ""; // going back to the automatic one
  }
  function pronAttrs(key) {
    return ` data-key="${esc(key)}"` + (state.editing ? ` tabindex="0"` : "");
  }
  // What the published files say about a word.
  function published(code, key) {
    for (const c of Object.values((state.data && state.data.courses) || {})) {
      if (c.learning !== code) continue;
      for (const w of c.words || []) if (w.text === key) return { found: true, pron: w.pron || "", mine: w.pron_src === "you" };
    }
    const a = code === "pt" && aula.status === "ready" ? aula.pron[key] : null;
    if (a) return { found: true, pron: a[0] || "", mine: a[2] === "you" };
    const f = code === "fr" && frases.status === "ready" ? frases.pron[key] : null;
    if (f) return { found: true, pron: f[0] || "", mine: f[1] === "you" };
    return { found: false };
  }
  function handFixed(code, key) {
    const p = (edits.pending[code] || {})[key];
    return p ? !!p.pron : !!published(code, key).mine;
  }
  // Forget a pending fix once the published page has it (or after half an hour).
  function reconcilePending() {
    const now = Date.now();
    let changed = false;
    for (const [code, table] of Object.entries(edits.pending)) {
      for (const [key, p] of Object.entries(table || {})) {
        const id = editId(code, key);
        if (edits.queue.has(id) || edits.busy.has(id)) continue;
        if (!p || !(now - p.at < PENDING_MS)) { delete table[key]; changed = true; continue; }
        const pub = published(code, key);
        if (pub.found && (p.pron ? pub.pron === p.pron : !pub.mine)) { delete table[key]; changed = true; }
      }
      if (!table || !Object.keys(table).length) { delete edits.pending[code]; changed = true; }
    }
    if (changed) savePending();
  }
  function dropPending(code, key, at) {
    const table = edits.pending[code];
    if (!table || !table[key] || table[key].at !== at) return;
    delete table[key];
    if (!Object.keys(table).length) delete edits.pending[code];
    savePending();
  }
  function shownPron(code, key) {
    if (inAula()) return pronOf(key).pron;
    if (inFrases()) return sentPron(key);
    const c = course();
    const w = ((c && c.words) || []).find((x) => x.text === key);
    return pendingPron(code, key) || (w && w.pron) || "";
  }
  function refreshPron(code, key) {
    const c = course();
    if (!c || c.learning !== code) return;
    for (const el of document.querySelectorAll("#list .pron[data-key]")) {
      if (el.dataset.key !== key || el.querySelector("input")) continue;
      el.textContent = shownPron(code, key);
      el.className = "pron" + pronExtra(code, key);
    }
  }

  // ---- Messages ----
  let toastTimer = null;
  function toast(msg, kind) {
    const el = $("#toast");
    clearTimeout(toastTimer);
    el.textContent = msg;
    el.className = "toast" + (kind ? " " + kind : "");
    el.hidden = false;
    if (kind === "ok") toastTimer = setTimeout(() => { el.hidden = true; }, 8000);
  }
  $("#toast").addEventListener("click", () => { $("#toast").hidden = true; });

  // ---- GitHub ----
  function ghError(kind, status) { const e = new Error(kind); e.kind = kind; e.status = status; return e; }
  async function gh(method, path, body, token = edits.token) {
    let r;
    try {
      r = await fetch(`https://api.github.com/repos/${repoName()}/${path}`, {
        method,
        cache: "no-store",
        headers: Object.assign({ Accept: "application/vnd.github+json", Authorization: `Bearer ${token}` },
          body ? { "Content-Type": "application/json" } : {}),
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch { throw ghError("net", 0); }
    const data = await r.json().catch(() => null);
    if (r.ok) return data;
    const msg = String((data && data.message) || "");
    const kind = r.status === 401 ? "auth"
      : r.status === 403 || r.status === 404 ? "perm"
      : r.status === 409 || (r.status === 422 && /sha/i.test(msg)) ? "conflict"
      : "other";
    throw ghError(kind, r.status);
  }
  const toB64 = (s) => {
    let bin = "";
    for (const b of new TextEncoder().encode(s)) bin += String.fromCharCode(b);
    return btoa(bin);
  };
  const fromB64 = (b) => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g, "")), (ch) => ch.charCodeAt(0)));

  // The same table the sync reads: "fr-es" if you made one, otherwise "fr".
  function tableFor(json, code, from) {
    const long = json[`${code}-${from}`];
    if (long && typeof long === "object" && !Array.isArray(long) && Object.keys(long).length) return long;
    if (!json[code] || typeof json[code] !== "object" || Array.isArray(json[code])) json[code] = {};
    return json[code];
  }
  function applyFix(json, { code, from, key, pron }) {
    const table = tableFor(json, code, from);
    const cur = table[key];
    const isObj = cur && typeof cur === "object" && !Array.isArray(cur); // keeps a note or meanings you set
    if (pron) {
      if (isObj) cur.pron = pron; else table[key] = pron;
    } else if (isObj) {
      delete cur.pron;
      if (!Object.keys(cur).length) delete table[key];
    } else {
      delete table[key];
    }
  }
  function commitMessage(items) {
    const list = items.map((i) => i.pron ? `${i.key} → ${i.pron}` : `${i.key} (automatic again)`).join(", ");
    return `Fix pronunciation${items.length > 1 ? "s" : ""}: ${list}\n\nSaved from the page.`;
  }
  async function writeFixes(items) {
    for (let tries = 0; ; tries++) {
      const file = await gh("GET", FILE);
      let json;
      try { json = JSON.parse(fromB64(file.content)); } catch { throw ghError("broken", 0); }
      if (!json || typeof json !== "object" || Array.isArray(json)) throw ghError("broken", 0);
      const before = JSON.stringify(json);
      for (const it of items) applyFix(json, it);
      if (JSON.stringify(json) === before) return; // nothing to change
      try {
        await gh("PUT", FILE, { message: commitMessage(items), content: toB64(JSON.stringify(json, null, 1) + "\n"), sha: file.sha });
        return;
      } catch (err) {
        if (err.kind !== "conflict" || tries >= 2) throw err;
      }
    }
  }
  // Is this token good for this repo, and can it write? Reading the file
  // checks the first part. For the second, the file goes back unchanged with a
  // made-up version: GitHub checks permission first (403 for a read-only
  // token) and then turns down the stale version (409), so nothing is saved.
  async function checkToken(token) {
    const file = await gh("GET", FILE, null, token);
    try {
      await gh("PUT", FILE, { message: "Check the edit token", content: String(file.content).replace(/\s/g, ""), sha: "0".repeat(40) }, token);
    } catch (err) {
      if (err.kind === "perm" || err.kind === "auth" || err.kind === "net") throw err;
    }
  }

  // ---- Saving ----
  function queueFix(code, from, key, pron) {
    const at = Date.now();
    (edits.pending[code] = edits.pending[code] || {})[key] = { pron, at };
    savePending();
    const id = editId(code, key);
    edits.queue.set(id, { id, code, from, key, pron, at });
    refreshPron(code, key);
    flush();
  }
  async function flush() {
    if (edits.busy.size || !edits.queue.size) return;
    const items = [...edits.queue.values()];
    edits.queue.clear();
    for (const it of items) edits.busy.add(it.id);
    toast(t().saving(items.length === 1 ? items[0].key : ""), "wait");
    let err = null;
    try { await writeFixes(items); } catch (e) { err = e; }
    edits.busy.clear();
    if (err) for (const it of items) dropPending(it.code, it.key, it.at);
    for (const it of items) refreshPron(it.code, it.key);
    if (err) { saveFailed(err, items); return; }
    const s = t();
    toast(s.saved(items.map((i) => `${i.key} → ${i.pron || s.auto}`).join(", ")), "ok");
    if (edits.queue.size) flush();
  }
  function saveFailed(err, items) {
    const s = t();
    if (err.kind === "auth") {
      // The token was deleted or expired: drop everything waiting and ask for a new one.
      for (const it of edits.queue.values()) dropPending(it.code, it.key, it.at);
      edits.queue.clear();
      forgetToken();
      render();
      $("#toast").hidden = true;
      openKey(s.keyExpired);
      return;
    }
    const why = { net: s.errNet, perm: s.errPerm, broken: s.errBroken, conflict: s.errConflict }[err.kind] || s.errOther(err.status);
    toast(s.notSaved(items.map((i) => s.quote(i.key)).join(", "), why), "bad");
    if (edits.queue.size) flush();
  }

  // ---- Editing a blue text in place ----
  const touchScreen = () => matchMedia("(pointer: coarse)").matches;
  const openEditors = new WeakMap(); // span → its finish(save)
  let lastClosed = { span: null, at: 0 }; // so the tap that closed a box doesn't reopen it
  function startEdit(span, viaKeyboard) {
    if (span.querySelector("input")) return;
    const c = course();
    if (!c) return;
    const code = c.learning, from = c.from, key = span.dataset.key;
    const old = span.textContent;
    const input = document.createElement("input");
    input.type = "text";
    input.className = "pron-in";
    input.value = old;
    input.lang = "es";
    input.autocomplete = "off";
    input.spellcheck = false;
    input.setAttribute("autocapitalize", "off");
    input.setAttribute("autocorrect", "off");
    input.setAttribute("enterkeyhint", "done");
    input.setAttribute("aria-label", t().editOne(key));
    const fit = () => { input.size = Math.max(6, input.value.length + 2); };
    fit();
    span.textContent = "";
    span.classList.add("is-editing");
    span.append(input);
    // Phones have no Esc key: a × next to the box cancels instead.
    let cancelled = false;
    if (touchScreen()) {
      const x = document.createElement("button");
      x.type = "button";
      x.className = "pron-x";
      x.textContent = "×";
      x.setAttribute("aria-label", t().cancel);
      // Keep the focus in the box (so the tap reaches the ×), and mark the
      // cancel early in case the browser moves the focus anyway.
      x.addEventListener("mousedown", (e) => e.preventDefault());
      x.addEventListener("pointerdown", () => { cancelled = true; });
      span.append(x);
    }
    input.focus();
    input.setSelectionRange(0, input.value.length);
    let done = false;
    const finish = (save, byTap) => {
      if (done) return;
      done = true;
      openEditors.delete(span);
      if (byTap) lastClosed = { span, at: Date.now() };
      const val = input.value.replace(/\s+/g, " ").trim().normalize("NFC");
      span.classList.remove("is-editing");
      span.textContent = old;
      if (!save || val === old) return;
      if (!val && !handFixed(code, key)) return; // it's already the automatic one
      queueFix(code, from, key, val || null);
    };
    openEditors.set(span, finish);
    // Only put the focus back on the blue text if you got here with the keyboard.
    const back = () => { if (viaKeyboard) span.focus(); };
    input.addEventListener("input", fit);
    input.addEventListener("focus", () => { cancelled = false; });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); finish(true); back(); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); back(); }
    });
    // Tapping "Done" or anywhere else saves; the × cancels. Wait a moment so a
    // tap on the × has been seen first.
    input.addEventListener("blur", () => setTimeout(() => finish(!cancelled, true), 0));
  }
  // These run before the list's own handlers, so tapping a blue text edits it
  // instead of playing the word.
  $("#list").addEventListener("click", (e) => {
    if (!state.editing) return;
    const span = e.target.closest(".pron[data-key]");
    if (!span) return;
    e.stopPropagation();
    if (e.target.closest(".pron-x")) { const finish = openEditors.get(span); if (finish) finish(false, true); return; }
    if (lastClosed.span === span && Date.now() - lastClosed.at < 600) return;
    startEdit(span, false);
  }, true);
  $("#list").addEventListener("keydown", (e) => {
    if (!state.editing || e.key !== "Enter" || !e.target.matches || !e.target.matches(".pron[data-key]")) return;
    e.preventDefault();
    e.stopPropagation();
    startEdit(e.target, true);
  }, true);

  // ---- Turning it on and off ----
  function setEditing(on) {
    state.editing = !!on && !!edits.token;
    store.set("editing", state.editing); // stays on (or off) next time on this device
    render();
  }
  function forgetToken() {
    edits.token = "";
    state.editing = false;
    store.set("editing", false);
    try { localStorage.removeItem("carnet:ghToken"); } catch { /* private mode */ }
  }
  $("#edit").addEventListener("click", () => setEditing(!state.editing));
  $("#editLink").addEventListener("click", () => {
    if (!edits.token) { openKey(); return; }
    if (!confirm(t().forgetAsk)) return;
    forgetToken();
    render();
  });

  // ---- The one-time setup: paste your token ----
  function openKey(reason) {
    const s = t();
    const d = $("#key");
    d.innerHTML = `<form method="dialog" id="keyForm">` +
      `<h2 id="keyTitle" tabindex="-1">${esc(s.keyTitle)}</h2>` +
      (reason ? `<p class="err">${esc(reason)}</p>` : "") +
      `<p>${esc(s.keyIntro)}</p>` +
      `<p class="small">${esc(s.keySafe)}</p>` +
      `<ol><li>${s.keyStep1(tokenUrl(), repoName().split("/")[1] || "duolingo-words")}</li><li>${esc(s.keyStep2)}</li></ol>` +
      `<label><span class="sr">${esc(s.keyLabel)}</span><input id="keyIn" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="github_pat_…"></label>` +
      `<p class="err" id="keyErr" role="alert" hidden></p>` +
      `<p class="small">${esc(s.keyNote)}</p>` +
      `<p class="btns"><button type="button" class="cancel" id="keyCancel">${esc(s.cancel)}</button>` +
      `<button type="submit" class="go" id="keyGo">${esc(s.keySave)}</button></p></form>`;
    if (!d.open) d.showModal();
    // On a phone, focusing the box would pop the keyboard up over the steps.
    if (touchScreen()) d.querySelector("h2").focus({ preventScroll: true });
    else $("#keyIn").focus();
  }
  $("#key").addEventListener("click", (e) => {
    const d = $("#key");
    if (e.target.id === "keyCancel") { d.close(); return; }
    if (e.target !== d) return;
    const r = d.getBoundingClientRect(); // a click on the dark backdrop also closes it
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) d.close();
  });
  $("#key").addEventListener("submit", async (e) => {
    e.preventDefault();
    const s = t();
    const token = $("#keyIn").value.replace(/\s+/g, "");
    const err = $("#keyErr"), go = $("#keyGo");
    if (!token) { err.textContent = s.keyEmpty; err.hidden = false; return; }
    go.disabled = true;
    go.textContent = s.keyChecking;
    err.hidden = true;
    try {
      await checkToken(token);
      edits.token = token;
      store.set("ghToken", token);
      $("#key").close();
      setEditing(true);
      toast(s.keyOk, "ok");
    } catch (x) {
      err.textContent = x.kind === "auth" ? s.keyBad : x.kind === "perm" ? s.errPerm : x.kind === "net" ? s.errNet : s.errOther(x.status);
      err.hidden = false;
    } finally {
      go.disabled = false;
      go.textContent = s.keySave;
    }
  });

  load();
})();

<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon carnet de français</title>
<meta name="description" content="Las palabras que aprendí en Duolingo, con su significado y cómo se pronuncian.">
<meta name="theme-color" content="#fbfcfe" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131628" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="Mon carnet">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="fonts/spectral-400.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="fonts/playwrite-fr-trad.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face { font-family: "Spectral"; src: url("fonts/spectral-400.woff") format("woff"); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: "Spectral"; src: url("fonts/spectral-400-italic.woff") format("woff"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Spectral"; src: url("fonts/spectral-600.woff") format("woff"); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: "Playwrite FR Trad"; src: url("fonts/playwrite-fr-trad.woff") format("woff"); font-weight: 300; font-style: normal; font-display: swap; }
@font-face { font-family: "Playwrite BR"; src: url("fonts/playwrite-br.woff") format("woff"); font-weight: 300; font-style: normal; font-display: swap; }

/* Seyès paper: a fine line every 8px, a stronger one every 32px, and the red margin. */
:root {
  --paper: #fbfcfe;
  --line-minor: rgba(118, 120, 205, .11);
  --line-major: rgba(118, 120, 205, .30);
  --line-vert: rgba(118, 120, 205, .09);
  --margin-red: #e2506a;
  --ink: #1d2140;
  --ink-soft: #575d82;
  --pen: #2448c7;
  --pen-wash: rgba(36, 72, 199, .09);
  --red-pen: #c4263f;
  --tape: #ffffff;
  --tape-edge: rgba(29, 33, 64, .14);
  --grid-y: 23px;
  --margin-x: 88px;
  --gutter: 28px;
  --serif: "Spectral", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --script-fr: "Playwrite FR Trad", "Segoe Script", "Snell Roundhand", cursive;
  --script-br: "Playwrite BR", "Playwrite FR Trad", "Segoe Script", cursive;
  --script: var(--script-fr);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #131628;
    --line-minor: rgba(150, 158, 255, .07);
    --line-major: rgba(150, 158, 255, .17);
    --line-vert: rgba(150, 158, 255, .05);
    --margin-red: #ff6b86;
    --ink: #e8eaf7;
    --ink-soft: #a6abcb;
    --pen: #93adff;
    --pen-wash: rgba(147, 173, 255, .13);
    --red-pen: #ff8da2;
    --tape: #262a44;
    --tape-edge: rgba(232, 234, 247, .16);
  }
}
@media (max-width: 719px) {
  :root { --margin-x: 46px; --gutter: 14px; }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--ink);
  font: 400 18px/32px var(--serif);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--line-major) 1px, transparent 1px),
    linear-gradient(var(--line-minor) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-vert) 1px, transparent 1px);
  background-size: 100% 32px, 100% 8px, 32px 100%;
  background-position: 0 var(--grid-y), 0 var(--grid-y), 0 0;
}
/* Each notebook writes in its own school's cursive; the Portuguese one is a plain ruled caderno. */
body.script-br { --script: var(--script-br); }
body.paper-ruled {
  background-image: linear-gradient(var(--line-major) 1px, transparent 1px);
  background-size: 100% 32px;
  background-position: 0 var(--grid-y);
}
.page {
  min-height: 100vh;
  position: relative;
  max-width: 1080px;
  margin: 0 auto;
  padding: 32px 32px 96px calc(var(--margin-x) + var(--gutter));
}
.page::before {
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: var(--margin-x);
  width: 1.5px;
  background: var(--margin-red);
  opacity: .7;
}
@media (max-width: 719px) { .page { padding-right: 16px; } }

/* The logo sits in the margin, stuck on like a sticker. */
.sticker {
  position: absolute;
  top: 40px;
  left: calc(var(--margin-x) - 64px - 12px);
  width: 64px;
  height: 64px;
  border-radius: 14px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(29, 33, 64, .16), 0 6px 14px rgba(29, 33, 64, .10);
  transform: rotate(-4deg);
}
@media (max-width: 719px) {
  .sticker { top: 22px; left: 5px; width: 36px; height: 36px; border-radius: 9px; }
}

a { color: var(--pen); text-decoration-thickness: 1px; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--pen); outline-offset: 2px; border-radius: 4px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Notebook tabs */
.tabs { display: flex; flex-wrap: wrap; gap: 0 32px; margin: 0; }
.tab {
  height: 64px;
  padding: 0 2px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--ink-soft);
  font: 300 24px/62px var(--script-fr);
  cursor: pointer;
}
.tab.script-br { font-family: var(--script-br); }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--margin-red); }
.tab:hover { color: var(--ink); }
.tabs:not([hidden]) + .title { margin-top: 0; }
@media (max-width: 719px) { .tab { font-size: 20px; } }

/* Cover */
.title {
  margin: 32px 0 32px;
  font: 300 46px/96px var(--script);
  letter-spacing: .005em;
}
@media (max-width: 719px) { .title { font-size: 28px; line-height: 64px; margin: 0 0 32px; } }
.summary { margin: 0; max-width: 62ch; font-size: 19px; }
.status { margin: 0; color: var(--ink-soft); font-size: 16px; }
.status.bad { color: var(--red-pen); }
.demo { margin: 0; color: var(--red-pen); font-size: 16px; font-style: italic; }

/* Tools */
.tools {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 24px;
  margin: 32px 0 0;
  padding: 16px 0 15px;
  background: var(--paper);
  border-bottom: 1px solid var(--line-major);
}
.tools::before { /* keep the margin line running behind the sticky bar */
  content: "";
  position: absolute;
  top: 0; bottom: 0;
  left: calc(-1 * var(--gutter));
  width: 1.5px;
  background: var(--margin-red);
  opacity: .7;
}
.search { flex: 1 1 260px; max-width: 420px; }
.search input {
  width: 100%;
  height: 32px;
  padding: 0 2px;
  border: 0;
  border-bottom: 1.5px solid var(--ink-soft);
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font: italic 400 18px/30px var(--serif);
}
.search input::placeholder { color: var(--ink-soft); opacity: .85; }
.search input:focus { outline: none; border-bottom-color: var(--pen); }
.search input::-webkit-search-cancel-button { filter: grayscale(1); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.toggle, .seg button {
  height: 32px;
  padding: 0 2px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--ink-soft);
  font: 400 17px/30px var(--serif);
  cursor: pointer;
}
.toggle[aria-pressed="true"], .seg button[aria-pressed="true"] {
  color: var(--ink);
  border-bottom-color: var(--margin-red);
}
.toggle:hover, .seg button:hover { color: var(--ink); }
.seg { display: flex; gap: 14px; }

/* Word list */
.group { margin: 0; }
.group > h2 {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  margin: 32px 0 0;
  font: 300 25px/64px var(--script);
}
.group > h2 .when { text-decoration: underline 2px var(--margin-red); text-underline-offset: 9px; text-decoration-skip-ink: none; }
.group > h2 .count { font: italic 400 16px/32px var(--serif); color: var(--ink-soft); white-space: nowrap; }
@media (max-width: 719px) {
  .group > h2 { font-size: 19px; }
  .tools { position: static; gap: 8px 16px; }
  .toggles { gap: 4px 14px; }
  .toggle, .seg button { font-size: 16px; }
}
@media (max-width: 479px) { .group > h2 .count { display: none; } }
.entries { list-style: none; margin: 0; padding: 0; }
.entry {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, .9fr) minmax(0, 1.25fr);
  column-gap: 24px;
  padding: 0 8px;
  margin: 0 -8px;
  border-radius: 3px;
}
.entry.playing { background: var(--pen-wash); }
.word { font-weight: 600; font-size: 21px; overflow-wrap: anywhere; }
.pron { color: var(--pen); font-style: italic; font-size: 19px; overflow-wrap: anywhere; }
.meaning { overflow-wrap: anywhere; }
.note { display: block; color: var(--ink-soft); font-style: italic; font-size: 16px; }
@media (max-width: 719px) {
  .entry { display: block; padding-top: 0; padding-bottom: 0; }
  .word { margin-right: 12px; }
  .word, .pron { display: inline; }
  .meaning { display: block; }
}
.play {
  position: absolute;
  top: 2px;
  left: calc(-1 * var(--gutter) - 8px - 12px - 28px + 8px);
  width: 28px; height: 28px;
  display: grid; place-items: center;
  padding: 0;
  border: 1.5px solid var(--pen);
  border-radius: 50%;
  background: var(--paper);
  color: var(--pen);
  cursor: pointer;
}
@media (max-width: 719px) { .play { left: calc(-1 * var(--gutter) - 8px - 6px - 28px + 8px); } }
.play svg { width: 14px; height: 14px; }
.play .bars { display: none; }
.entry.playing .play { background: var(--pen); color: var(--paper); }
.entry.playing .play .speaker { display: none; }
.entry.playing .play .bars { display: block; }
.bars rect { transform-origin: 50% 100%; animation: bar .8s ease-in-out infinite; }
.bars rect:nth-child(2) { animation-delay: -.25s; }
.bars rect:nth-child(3) { animation-delay: -.5s; }
@keyframes bar { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

/* Review mode: meanings (or, for sentences, the French) under correction tape */
.meaning.covered .tape, .orig.covered > .tape {
  display: inline-block;
  min-width: 7em;
  max-width: 100%;
  height: 24px;
  vertical-align: -5px;
  border: 1px solid var(--tape-edge);
  border-radius: 2px;
  background: var(--tape);
  box-shadow: 0 1px 0 var(--tape-edge);
  cursor: pointer;
  padding: 0;
}
.meaning.covered .text, .meaning.covered .note, .meaning.covered .src { display: none; }
.meaning:not(.covered) .tape, .orig:not(.covered) > .tape { display: none; }
.orig.covered .word, .orig.covered .pron { display: none; }

.message { margin: 32px 0 0; max-width: 60ch; color: var(--ink-soft); font-style: italic; }

/* Pronunciation guide */
.legend { margin: 64px 0 0; max-width: 760px; }
.legend summary { cursor: pointer; font: 600 19px/32px var(--serif); list-style: none; }
.legend summary::-webkit-details-marker { display: none; }
.legend summary::after { content: "  +"; font-family: var(--serif); color: var(--ink-soft); }
.legend[open] summary::after { content: "  −"; }
.legend p { margin: 0; color: var(--ink-soft); }
.legend dl { display: grid; grid-template-columns: 6.5em 1fr; column-gap: 20px; margin: 0; }
.legend dt { color: var(--pen); font-style: italic; font-size: 19px; }
.legend dd { margin: 0; }
.legend .eg { color: var(--ink-soft); white-space: nowrap; }
@media (max-width: 719px) { .legend dl { grid-template-columns: 4.5em 1fr; } }

footer { margin: 64px 0 0; max-width: 62ch; color: var(--ink-soft); font-size: 16px; }
footer p { margin: 0; }
footer .links { display: flex; flex-wrap: wrap; gap: 0 20px; }
footer button { padding: 0; border: 0; background: none; color: var(--pen); font: inherit; text-decoration: underline 1px; text-underline-offset: 3px; cursor: pointer; }

@media (prefers-reduced-motion: reduce) { .bars rect { animation: none; transform: none; } }

[hidden] { display: none !important; }

/* ---- Edit mode: fix a pronunciation from the page. The Editar button only
   shows up in a browser where your GitHub token is saved. ---- */
body.editing .pron[data-key] {
  cursor: text;
  border-radius: 3px;
  text-decoration: underline dashed 1px;
  text-underline-offset: 6px;
}
body.editing .pron[data-key]:hover, body.editing .pron[data-key]:focus-visible { background: var(--pen-wash); }
body.editing .pron[data-key]:empty::before { content: "+"; opacity: .6; }
body.editing .pron[data-key].is-editing { text-decoration: none; background: none; }
.pron.saving, .pron.pending { opacity: .5; }
.pron-in {
  max-width: 100%;
  height: 30px;
  margin: 0 -4px;
  padding: 0 4px;
  border: 0;
  border-bottom: 1.5px solid var(--pen);
  border-radius: 3px 3px 0 0;
  background: var(--pen-wash);
  color: var(--pen);
  font: italic 400 19px/30px var(--serif);
}
.pron-in:focus { outline: none; }
.pron-x {
  display: inline-block;
  width: 30px;
  height: 30px;
  margin: 0 0 0 8px;
  padding: 0;
  border: 1px solid var(--tape-edge);
  border-radius: 50%;
  background: var(--paper);
  color: var(--ink-soft);
  font: 400 20px/27px var(--serif);
  text-align: center;
  vertical-align: top;
  cursor: pointer;
}
/* Touch screens: a finger needs more room than the text itself, and there's
   no Esc key, so the box gets a × to cancel. */
@media (pointer: coarse) {
  body.editing .pron[data-key] { position: relative; }
  body.editing .pron[data-key]:not(.is-editing)::after { content: ""; position: absolute; inset: -7px -30px -7px -10px; }
  .pron-in { max-width: calc(100% - 40px); }
}
.editbar { flex: 1 0 100%; margin: 0; color: var(--ink-soft); font: italic 400 16px/24px var(--serif); }
.toast {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  width: max-content;
  max-width: min(36em, calc(100vw - 32px));
  margin: 0;
  padding: 10px 18px;
  border: 1px solid var(--tape-edge);
  border-left: 3px solid var(--pen);
  border-radius: 4px;
  background: var(--paper);
  box-shadow: 0 1px 2px rgba(29, 33, 64, .14), 0 10px 24px rgba(29, 33, 64, .16);
  color: var(--ink);
  font: 400 16px/24px var(--serif);
  cursor: pointer;
}
.toast.bad { border-left-color: var(--red-pen); }
.toast.wait { border-left-color: var(--ink-soft); color: var(--ink-soft); font-style: italic; }
.key {
  width: min(560px, calc(100vw - 32px));
  max-height: calc(100vh - 32px);
  padding: 16px 28px 20px;
  border: 1px solid var(--tape-edge);
  border-radius: 8px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: 0 2px 4px rgba(29, 33, 64, .12), 0 18px 40px rgba(29, 33, 64, .22);
  font: 400 17px/26px var(--serif);
}
.key::backdrop { background: rgba(19, 22, 40, .45); }
.key h2 { margin: 0 0 8px; font: 300 24px/56px var(--script); }
.key h2:focus { outline: none; }
.key p, .key ol { margin: 0 0 12px; }
.key ol { padding-left: 1.3em; }
.key li { margin: 0 0 8px; }
.key input {
  width: 100%;
  height: 36px;
  padding: 0 2px;
  border: 0;
  border-bottom: 1.5px solid var(--ink-soft);
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font: 400 16px/34px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.key input:focus { outline: none; border-bottom-color: var(--pen); }
.key .small { color: var(--ink-soft); font-size: 15px; line-height: 22px; }
.key .err { color: var(--red-pen); }
.key .btns { display: flex; justify-content: flex-end; gap: 12px; margin: 16px 0 0; }
.key .btns button { height: 36px; padding: 0 18px; border-radius: 18px; font: 400 17px/32px var(--serif); cursor: pointer; }
.key .cancel { border: 0; background: none; color: var(--ink-soft); }
.key .go { border: 1.5px solid var(--pen); background: var(--pen); color: var(--paper); }
.key .go:disabled { opacity: .6; cursor: progress; }
.key { overflow: auto; overscroll-behavior: contain; }
@media (max-width: 479px) {
  .key { padding: 8px 18px 14px; font-size: 16px; line-height: 23px; }
  .key h2 { font-size: 21px; line-height: 44px; margin: 0 0 4px; }
  .key p, .key ol { margin: 0 0 8px; }
  .key li { margin: 0 0 4px; }
  .key .small { font-size: 14px; line-height: 20px; }
  .key .btns { margin-top: 10px; }
}

/* ---- Divider tabs: Duolingo | Aula (Portuguese), Duolingo | Frases importantes (French) ---- */
.views { display: flex; gap: 0 10px; height: 32px; margin: -32px 0 32px; }
.view {
  position: relative;
  height: 32px;
  padding: 0 16px;
  border: 1px solid var(--tape-edge);
  border-bottom: 0;
  border-radius: 10px 10px 0 0;
  background: var(--tab-bg);
  color: var(--ink-soft);
  font: 400 17px/31px var(--serif);
  cursor: pointer;
}
.view[data-view="duolingo"] { --tab-bg: rgba(88, 204, 2, .13); }
.view[data-view="aula"] { --tab-bg: rgba(255, 190, 0, .24); }
.view[data-view="frases"] { --tab-bg: rgba(28, 176, 246, .15); }
.view:hover { color: var(--ink); }
.view[aria-selected="true"] { color: var(--ink); font-weight: 600; }
.view[aria-selected="true"]::after {
  content: "";
  position: absolute;
  left: 12px; right: 12px; bottom: 0;
  height: 2px;
  background: var(--margin-red);
}

/* ---- Important sentences (Frases importantes), in the French notebook ---- */
/* French and its reading on the left, Spanish and when to use it on the right, a blank line between sentences. */
.entry.sent { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); }
.entry.sent + .entry.sent { margin-top: 32px; }
.orig { display: block; }
.entry.sent .word { display: inline; margin-right: 0; }
.entry.sent .pron { display: block; }
.entry.sent .orig.covered :is(.word, .pron) { display: none; }
.star { margin-right: 8px; color: var(--red-pen); font: 400 19px/1 var(--serif); }
.src { display: block; color: var(--ink-soft); font: italic 400 15px/32px var(--serif); }
.seg .seg-label { color: var(--ink-soft); font: italic 400 16px/32px var(--serif); }
body.view-frases .group { scroll-margin-top: 150px; }
@media (max-width: 719px) { body.view-frases .group { scroll-margin-top: 16px; } }

/* ---- Class notebook (Aula) ---- */
.secs { display: flex; flex-wrap: wrap; gap: 0 20px; flex: 1 1 100%; }
.secs button {
  height: 32px;
  padding: 0 2px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--ink-soft);
  font: 400 18px/30px var(--serif);
  cursor: pointer;
}
.secs button:hover { color: var(--ink); }
.secs button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--margin-red); }
.secs button.dim { opacity: .45; }
.lesson { position: relative; }
.lesson select {
  height: 32px;
  max-width: 15em;
  padding: 0 22px 0 2px;
  border: 0;
  border-bottom: 1.5px solid var(--ink-soft);
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font: italic 400 17px/30px var(--serif);
  -webkit-appearance: none;
  appearance: none;
  cursor: pointer;
}
.lesson::after { content: "▾"; position: absolute; right: 4px; top: 0; line-height: 32px; color: var(--ink-soft); pointer-events: none; }
.lesson select:focus { outline: none; border-bottom-color: var(--pen); }
.lesson select.on { color: var(--pen); border-bottom-color: var(--pen); }

body.view-aula .group, body.view-aula .group > h2, body.view-aula .aula-sec { scroll-margin-top: 150px; }
@media (max-width: 719px) { body.view-aula .group, body.view-aula .group > h2, body.view-aula .aula-sec { scroll-margin-top: 16px; } }
.intro, .lesson-q { margin: 32px 0 0; max-width: 66ch; }
.intro { color: var(--ink-soft); font-style: italic; }
.lesson-q b { font-weight: 600; }
.sec-head { margin: 64px 0 0; font: 300 34px/64px var(--script); color: var(--ink); }
.aula-sec:first-of-type .sec-head { margin-top: 32px; }
.tags { font: italic 400 16px/32px var(--serif); color: var(--ink-soft); text-align: right; }
.tags button, .link {
  padding: 0;
  border: 0;
  background: none;
  color: inherit;
  font: inherit;
  cursor: pointer;
  text-decoration: underline 1px dotted;
  text-underline-offset: 4px;
}
.tags button:hover, .link:hover { color: var(--pen); }
.link { color: var(--pen); text-decoration-style: solid; }
.score { font: italic 400 16px/32px var(--serif); color: var(--pen); margin-left: auto; padding-right: 14px; white-space: nowrap; }
.score + .tags { margin-left: 0; }
@media (max-width: 719px) {
  body.view-aula .group > h2 { flex-wrap: wrap; row-gap: 0; }
  body.view-aula .group > h2 .tags { flex: 1 1 100%; text-align: left; line-height: 32px; }
  .sec-head { font-size: 26px; }
}

/* Skip a line between the parts of a card, like in a real notebook. */
.card > :is(.blk, .ojo, .exs, .entries, .conj, .forms, .rules, .vs, .tblwrap, .tl, .quote, .sounds, .prompts, .qs, .dt-row, .use) { margin-top: 32px; }
.card > :is(h2, .blk-h, .gnote, .aka) + * { margin-top: 0; }
.card > .use + :is(.entries, .prompts, .qs, .dt-row) { margin-top: 0; }
.aka { margin: 0; color: var(--ink-soft); font-style: italic; }
.use, .blk, .ojo, .gnote { margin: 0; max-width: 68ch; }
.gnote { color: var(--ink-soft); font-style: italic; font-size: 17px; }
.blk-h { margin: 32px 0 0; font: 600 18px/32px var(--serif); }
.ojo::before { content: "Ojo: "; color: var(--red-pen); font-weight: 600; }
.pt { font-weight: 600; }
.say { cursor: pointer; border-radius: 3px; }
.say:not(.entry):hover { text-decoration: underline 1.5px dotted var(--pen); text-underline-offset: 4px; }
.say.playing:not(.entry) { background: var(--pen-wash); }
.red { color: var(--red-pen); }
.duo { margin-left: 6px; color: var(--pen); font: 400 15px/1 var(--serif); vertical-align: 2px; }

/* Examples: Portuguese on the left, Spanish on the right */
.entry.ex { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); }
.entry.ex .word { font-weight: 400; font-size: 19px; }
.entry.ex .word .red { font-weight: 600; }
.entry.ex .meaning { color: var(--ink-soft); font-style: italic; }

/* Conjugation tables */
.conj, .forms, .vtable { display: grid; column-gap: 16px; margin: 0; }
.conj { grid-template-columns: 9em repeat(var(--cols), minmax(0, 1fr)); max-width: 820px; }
.forms { grid-template-columns: minmax(8em, 1fr) repeat(4, minmax(0, 1fr)); }
.vtable { grid-template-columns: 11.5em repeat(4, minmax(0, 1fr)); }
.ch, .fh, .vh { font: italic 400 16px/32px var(--serif); color: var(--ink-soft); }
.cp { font: italic 400 16px/32px var(--serif); color: var(--ink-soft); }
.cp .short { display: none; }
.vlink { padding: 0; border: 0; background: none; color: var(--ink); font: 600 18px/32px var(--serif); cursor: pointer; text-align: left; }
.vlink:hover { color: var(--pen); }
.fv { line-height: 32px; overflow-wrap: anywhere; }
.fes { color: var(--ink-soft); font-style: italic; font-size: 16px; }
.fc { position: relative; min-width: 0; }
.fw { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 7px; min-width: 0; }
.fc .form { font-size: 18.5px; line-height: 32px; }
.fp { color: var(--pen); font-style: italic; font-size: 16px; line-height: 32px; }
.fc .fp { font-size: 14.5px; }
.fc .tape { display: none; position: absolute; left: 0; top: 4px; width: min(7em, 100%); height: 24px; padding: 0; border: 1px solid var(--tape-edge); border-radius: 2px; background: var(--tape); box-shadow: 0 1px 0 var(--tape-edge); cursor: pointer; }
.fc.covered .form, .fc.covered .fp { visibility: hidden; }
.fc.covered .tape { display: block; }
.tn { line-height: 32px; }
.tn .link { color: var(--ink); text-decoration-style: dotted; }
.vextra { margin: 0; }
.vextra .lbl { color: var(--ink-soft); font-style: italic; }
.lookup-bar { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 16px; }
.vsearch input {
  width: 11em;
  height: 32px;
  padding: 0 2px;
  border: 0;
  border-bottom: 1.5px solid var(--ink-soft);
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font: 600 21px/30px var(--serif);
}
.vsearch input:focus { outline: none; border-bottom-color: var(--pen); }
.ves { color: var(--ink-soft); font-style: italic; }
.allverbs summary { cursor: pointer; color: var(--pen); list-style: none; }
.allverbs summary::-webkit-details-marker { display: none; }
.chips { margin: 0; display: flex; flex-wrap: wrap; gap: 0 14px; }
.chip { padding: 0; border: 0; background: none; color: var(--ink); font: 400 18px/32px var(--serif); cursor: pointer; }
.chip.irr { color: var(--red-pen); }
.chip:hover { text-decoration: underline 1px; text-underline-offset: 4px; }
.chip[aria-current] { font-weight: 600; text-decoration: underline 2px var(--margin-red); text-underline-offset: 6px; }
@media (max-width: 719px) {
  .conj { grid-template-columns: 3.4em repeat(var(--cols), minmax(0, 1fr)); column-gap: 8px; }
  .conj .fw { display: block; }
  .conj .fc .form { font-size: 17px; }
  .conj .fc .fp { display: block; font-size: 13.5px; }
  .cp .long { display: none; }
  .cp .short { display: inline; }
  .forms, .vtable { grid-template-columns: 1fr 1fr; column-gap: 12px; }
  .forms .fh, .vtable .vh { display: none; }
  .forms .fv, .vtable .tn { grid-column: 1 / -1; }
  .forms .fc, .vtable .fc { display: grid; grid-template-columns: 3.1em minmax(0, 1fr); }
  .forms .fc::before, .vtable .fc::before { content: attr(data-p); color: var(--ink-soft); font-style: italic; font-size: 14px; line-height: 32px; }
  .forms .fc .tape, .vtable .fc .tape { left: 3.1em; width: min(5.5em, calc(100% - 3.1em)); }
  .fc .form { font-size: 17.5px; }
  .fc .fp { font-size: 14px; }
  .lesson select { max-width: 9.6em; }
  .toggles { gap: 4px 14px; }
  .blank { width: 6em; }
}

/* Rules, sounds and patterns: a label in the margin column */
.rules, .sounds { display: grid; grid-template-columns: 9.5em 1fr; column-gap: 20px; margin: 0; max-width: 900px; }
.rules dt, .sounds dt { color: var(--pen); font-style: italic; font-size: 18px; }
.rules dd, .sounds dd { margin: 0; }
.rexp, .rx { display: block; }
.rx .res { color: var(--ink-soft); font-style: italic; }
.rx .rpt .red { font-weight: 600; }
.sws { display: flex; flex-wrap: wrap; gap: 0 18px; }
.sw .pt { font-weight: 600; }
.pes { color: var(--ink-soft); font-style: italic; }
@media (max-width: 719px) {
  .rules, .sounds { grid-template-columns: 1fr; }
  .rules dt, .sounds dt { margin-top: 8px; }
}

/* Mistakes Spanish speakers make: crossed out on the left, right on the right */
.vs { list-style: none; margin: 0; padding: 0; max-width: 900px; }
.vs li { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 24px; }
.vs .wrong { color: var(--red-pen); text-decoration: line-through 1.5px rgba(196, 38, 63, .55); }
.vs .right::before { content: "✓ "; color: var(--pen); }
.vs .why { grid-column: 1 / -1; color: var(--ink-soft); font-style: italic; font-size: 16px; }
.vs.es .wrong { color: var(--ink-soft); font-style: italic; text-decoration: none; }
.vs.es .right::before { content: "→ "; color: var(--ink-soft); }
@media (max-width: 719px) { .vs li { grid-template-columns: 1fr; } }

.tblwrap { overflow-x: auto; max-width: 100%; }
.tbl { border-collapse: collapse; margin: 0; }
.tbl th, .tbl td { height: 32px; padding: 0 22px 0 0; text-align: left; vertical-align: top; font-weight: 400; line-height: 32px; white-space: nowrap; }
.tbl thead th { color: var(--ink-soft); font-style: italic; font-size: 16px; }
.tbl tbody th { color: var(--ink-soft); font-style: italic; }
.tbl tbody th .say { color: var(--ink); font-style: normal; font-weight: 600; }
@media (max-width: 719px) {
  .tbl th, .tbl td { white-space: normal; height: auto; padding-right: 12px; }
}

.quote { margin: 0; padding-left: 16px; border-left: 2px solid var(--line-major); max-width: 60ch; }
.quote p { margin: 0; }
.quote .qpt { font-style: italic; }
.quote .qes { color: var(--ink-soft); }
.quote .qby { color: var(--ink-soft); font-size: 16px; }

/* Pretérito × imperfeito: a wavy background and the moment something happens */
.tl { max-width: 640px; margin: 0; }
.tl svg { display: block; width: 100%; height: 64px; }
.tl p { margin: 0; }
.tl-axis { stroke: var(--line-major); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
.tl-wave { fill: none; stroke: var(--pen); stroke-width: 2; vector-effect: non-scaling-stroke; }
.tl-tick { stroke: var(--red-pen); stroke-width: 3; vector-effect: non-scaling-stroke; }
.tl-bg { color: var(--pen); font-weight: 600; }
.tl-ev { color: var(--red-pen); font-weight: 600; }
.tl-es, .tl-key { color: var(--ink-soft); font-style: italic; }
.k-imp { color: var(--pen); }
.k-pret { color: var(--red-pen); }

/* Conversation prompts */
.prompts { list-style: none; margin: 0; padding: 0; }
.prompt { position: relative; padding: 0 8px; margin: 0 -8px; border-radius: 3px; }
.prompt.playing { background: var(--pen-wash); }
.prompt.playing .play { background: var(--pen); color: var(--paper); }
.prompt.playing .play .speaker { display: none; }
.prompt.playing .play .bars { display: block; }
.pl { color: var(--ink-soft); font-style: italic; font-size: 16px; margin-right: 6px; }
.pq { font-weight: 600; }
.pa { padding: 0 0 0 0; }
.pa .pat { font-style: italic; }
.pa .pes, .pa .puses { color: var(--ink-soft); font-size: 16px; }
.pa .puses { font-style: italic; }

/* Practice */
.qs { margin: 0; padding: 0 0 0 1.6em; max-width: 900px; }
.q { padding-left: 4px; }
.q::marker { color: var(--ink-soft); font-size: 16px; }
.blank {
  width: 7.5em;
  height: 30px;
  margin: 0 4px;
  padding: 0 4px;
  border: 0;
  border-bottom: 1.5px solid var(--ink-soft);
  border-radius: 0;
  background: transparent;
  color: var(--pen);
  font: italic 400 19px/30px var(--serif);
  text-align: center;
}
.blank.wide { width: 12em; margin: 0; text-align: left; }
.blank:focus { outline: none; border-bottom-color: var(--pen); background: var(--pen-wash); }
.blank.ok { border-bottom-color: var(--pen); color: var(--pen); }
.blank.bad, .blank.almost { border-bottom-color: var(--red-pen); color: var(--red-pen); }
.gap { letter-spacing: .05em; color: var(--ink-soft); }
.filled { color: var(--pen); font-weight: 600; }
.hint { color: var(--ink-soft); font-style: italic; }
.opts { display: inline-flex; flex-wrap: wrap; gap: 4px 8px; vertical-align: 1px; }
.opt {
  height: 28px;
  padding: 0 12px;
  border: 1.5px solid var(--line-major);
  border-radius: 14px;
  background: var(--paper);
  color: var(--ink);
  font: 400 17px/24px var(--serif);
  cursor: pointer;
}
.opt:hover:not([disabled]) { border-color: var(--pen); color: var(--pen); }
.opt.ok { border-color: var(--pen); background: var(--pen-wash); color: var(--pen); }
.opt.bad { border-color: var(--red-pen); color: var(--red-pen); text-decoration: line-through; }
.opt[disabled] { cursor: default; }
.fb { display: block; font-style: italic; font-size: 16px; color: var(--ink-soft); }
.fb.ok::before { content: "✓ "; color: var(--pen); font-style: normal; }
.fb.bad::before { content: "✗ "; color: var(--red-pen); font-style: normal; }
.set-foot, .dt-row, .dq, .da { margin: 0; }
.dt-row { display: flex; flex-wrap: wrap; gap: 0 16px; }
.dq { font-size: 20px; }
.dq b { color: var(--pen); }
</style>

  // ---- One notebook per course ----
  const NOTEBOOKS = {
    fr: { title: "Mon carnet de français", tab: "Français", locale: "fr-FR", until: d => `Jusqu’au ${d}`, script: "fr", paper: "seyes" },
    pt: { title: "Meu caderno de português", tab: "Português", locale: "pt-BR", until: d => `Até ${d}`, script: "br", paper: "ruled" },
  };
  function notebook(code) {
    if (NOTEBOOKS[code]) return NOTEBOOKS[code];
    let own = code;
    try { own = new Intl.DisplayNames([code], { type: "language" }).of(code) || code; } catch { /* unknown code */ }
    own = own.charAt(0).toUpperCase() + own.slice(1);
    return { title: own, tab: own, locale: code, until: d => t().until(d), script: "fr", paper: "seyes" };
  }

  // ---- Pronunciation guide, per language. Each entry shows up only when one of
  // your words uses it, with that word as the example. p = pronunciation, i = IPA.
  const has = re => p => re.test(p);
  // eSpeak marks nasal vowels with a tilde (French) or a closing ŋ (Portuguese "bem" = bˈeɪŋ).
  const nasal = (p, i) => (/\u0303/.test(i.normalize("NFD")) || /ŋ(?![aeiouyæɐəɛɔɪʊ])/.test(i)) && /[aeiou][nm]/.test(p);
  const accent = p => /[áéíóúǘ]|́/.test(p.normalize("NFC"));
  const SAME = {
    sh: { sym: "sh", test: has(/sh/), es: "Como en «show».", en: "As in “show”." },
    v: { sym: "v", test: has(/v/), es: "Con los dientes de arriba sobre el labio de abajo. No es la b.", en: "Upper teeth on the lower lip. Not a b." },
    u: { sym: "ü", test: has(/ü/), es: "Di «i» con los labios redondeados, como para silbar.", en: "Say “i” with your lips rounded, as if to whistle." },
    o: { sym: "ö", test: has(/ö/), es: "Di «e» con los labios redondeados, como para decir «o».", en: "Say “e” with your lips rounded, as if to say “o”." },
  };
  const LEGENDS = {
    fr: [
      SAME.u, SAME.o,
      { sym: "an en on", test: nasal, es: "Vocal nasal: el aire sale también por la nariz y la n casi no suena.", en: "Nasal vowel: air also goes out through the nose and the n is barely heard." },
      { sym: "r", test: (p, i) => /ʁ/.test(i), es: "La r francesa se dice al fondo de la garganta, parecida a una j suave. Nunca es la r de «perro».", en: "The French r is made at the back of the throat, close to a soft Spanish j. Never the rolled r of “perro”." },
      { sym: "y", test: (p, i) => /ʒ/.test(i) && /y/.test(p), es: "Antes de vocal suena como la «ll» argentina de «yo».", en: "Before a vowel it sounds like the Argentine “ll” in “yo”." },
      SAME.sh,
      { sym: "z", test: has(/z/), es: "Una s que zumba, como una abeja.", en: "A buzzing s, like a bee." },
      SAME.v,
      { sym: "á é í ó ú", test: accent, es: "La tilde marca dónde va la fuerza. En francés casi siempre es la última sílaba.", en: "The accent shows where the stress goes. In French it's almost always the last syllable." },
    ],
    pt: [
      { sym: "an en in on un", test: nasal, es: "Vocal nasal: el aire sale también por la nariz y la n casi no suena.", en: "Nasal vowel: air also goes out through the nose and the n is barely heard." },
      { sym: "j", test: (p, i) => /[xhχʁ]/.test(i) && /j/.test(p), es: "La r fuerte (al inicio de palabra o «rr») suena como una j suave.", en: "The strong r (at the start of a word or “rr”) sounds like a soft Spanish j." },
      { sym: "ch", test: (p, i) => /tʃ/.test(i), es: "En Brasil, la t antes de i suena «ch».", en: "In Brazil, a t before i sounds like “ch”." },
      { sym: "y", test: (p, i) => /ʒ/.test(i) && /y/.test(p), es: "Como la «ll» argentina de «yo». Así suenan la j y, en Brasil, la d antes de i.", en: "Like the Argentine “ll” in “yo”. That's the j, and in Brazil a d before i." },
      SAME.sh,
      { sym: "z", test: has(/z/), es: "Una s que zumba, como una abeja. Así suena la s entre vocales.", en: "A buzzing s, like a bee. That's an s between vowels." },
      SAME.v,
      { sym: "ll", test: (p, i) => /ʎ/.test(i), es: "La lengua toca el paladar, como una «li» muy rápida (lh).", en: "Tongue against the palate, like a very quick “li” (lh)." },
      { sym: "u", test: (p, i) => /ʊ(\s|$)/.test(i), es: "La o del final suena casi como u.", en: "A final o sounds almost like u." },
      { sym: "á é í ó ú", test: accent, es: "La tilde marca la sílaba fuerte.", en: "The accent marks the stressed syllable." },
    ],
    other: [
      SAME.u, SAME.o,
      { sym: "an en on", test: nasal, es: "Vocal nasal: el aire sale también por la nariz y la n casi no suena.", en: "Nasal vowel: air also goes out through the nose and the n is barely heard." },
      SAME.sh,
      { sym: "z", test: has(/z/), es: "Una s que zumba, como una abeja.", en: "A buzzing s, like a bee." },
      SAME.v,
      { sym: "á é í ó ú", test: accent, es: "La tilde marca la sílaba fuerte.", en: "The accent marks the stressed syllable." },
    ],
  };
  const SPEECH_TAGS = { fr: "fr-FR", es: "es-ES", pt: "pt-BR", en: "en-US", zh: "zh-CN", zs: "zh-CN", it: "it-IT", de: "de-DE", ja: "ja-JP", ko: "ko-KR" };
  const DAY = 86400000;

  // ---- Small helpers ----
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fold = (s) => String(s ?? "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/œ/g, "oe").replace(/æ/g, "ae").toLowerCase();
  const store = {
    get(k, d) { try { const v = localStorage.getItem("carnet:" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("carnet:" + k, JSON.stringify(v)); } catch { /* private mode */ } },
  };
  let lang = "es";
  const t = () => STR[lang];
  const num = (n) => new Intl.NumberFormat(lang === "es" ? "es" : "en").format(n);
  const langName = (code) => {
    try { return new Intl.DisplayNames([lang], { type: "language" }).of(code); } catch { return code; }
  };
  const fmtCache = new Map();
  function dateFmt(locale, opts) {
    const key = locale + JSON.stringify(opts);
    if (!fmtCache.has(key)) {
      let f;
      try { f = new Intl.DateTimeFormat(locale, opts); } catch { f = new Intl.DateTimeFormat("fr-FR", opts); }
      fmtCache.set(key, f);
    }
    return fmtCache.get(key);
  }

  // ---- State ----
  const state = {
    data: null, status: null, demo: false, courseKey: null,
    show: null,
    q: "", sort: store.get("sort", "recent"), week: false,
    quiz: store.get("quiz", false), slow: store.get("slow", false),
    // The part each notebook has open, like { pt: "aula", fr: "frases" } (see VIEWS).
    views: (() => {
      const v = store.get("views", null);
      if (v && typeof v === "object" && !Array.isArray(v)) return v;
      return { pt: store.get("view", "duolingo") === "aula" ? "aula" : "duolingo" }; // saved before French had parts
    })(),
    stars: store.get("stars", false), // only the essential sentences
    cover: store.get("cover", "es"), // what Repaso covers in the sentences: "es" or "fr"
    editing: store.get("editing", false) === true, // fixing pronunciations (only with your GitHub token); remembered per device
  };
  const revealed = new Set();
  // Notebooks with more than one part, under divider tabs. The first part is your Duolingo words.
  const VIEWS = { pt: ["duolingo", "aula"], fr: ["duolingo", "frases"] };
  function viewOf(c) {
    const parts = c && VIEWS[c.learning];
    const v = parts && state.views[c.learning];
    return parts && parts.includes(v) ? v : "duolingo";
  }

  // ---- Courses ----
  const keyOf = (c) => `${c.learning}-${c.from}`;
  function courseKeys() {
    if (!state.data) return [];
    const keys = new Set(Object.keys(state.data.courses || {}));
    for (const k of state.data.known || []) if (k && k.learning && k.from) keys.add(keyOf(k));
    const all = [...keys].sort();
    // data/notebooks.json picks which courses get a tab, and in what order.
    const show = state.show;
    if (!show) return all;
    const rank = (k) => show.indexOf(k.split("-")[0]);
    return all.filter((k) => rank(k) >= 0).sort((a, b) => rank(a) - rank(b) || a.localeCompare(b));
  }
  function courseInfo(key) {
    if (!state.data || !key) return null;
    const c = (state.data.courses || {})[key];
    if (c) return c;
    const k = (state.data.known || []).find((x) => keyOf(x) === key);
    return k ? { learning: k.learning, from: k.from, name: k.name, words: [] } : null;
  }
  const course = () => courseInfo(state.courseKey);
  function hashFor(key) {
    const c = courseInfo(key);
    if (!c) return "";
    const twins = courseKeys().filter((k) => k.split("-")[0] === c.learning).length > 1;
    return twins ? key : c.learning;
  }
  function keyFromHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return null;
    const keys = courseKeys();
    return keys.find((k) => k === h) || keys.find((k) => k.split("-")[0] === h) || null;
  }
  // "#aula" and "#aula/verbos" open the class notebook inside the Portuguese one,
  // and "#frases" the important sentences inside the French one.
  function routeHash() {
    const h = decodeURIComponent(location.hash.slice(1));
    const m = h.match(/^aula(?:\/([\w-]+))?$/);
    if (m) {
      const k = courseKeys().find((x) => x.split("-")[0] === "pt");
      if (k) {
        state.views.pt = "aula";
        if (m[1]) aula.sec = m[1];
        return k;
      }
    }
    if (h === "frases") {
      const k = courseKeys().find((x) => x.split("-")[0] === "fr");
      if (k) { state.views.fr = "frases"; return k; }
    }
    const k = keyFromHash();
    if (k && VIEWS[k.split("-")[0]]) state.views[k.split("-")[0]] = "duolingo";
    return k;
  }
  function currentHash() {
    const c = courseInfo(state.courseKey);
    if (c && c.learning === "pt" && viewOf(c) === "aula") {
      return aula.sec && aula.sec !== "vocabulario" ? `aula/${aula.sec}` : "aula";
    }
    if (c && c.learning === "fr" && viewOf(c) === "frases") return "frases";
    return hashFor(state.courseKey);
  }
  function syncHash() {
    const h = currentHash();
    if (h) history.replaceState(null, "", "#" + h);
  }
  function pickCourse() {
    const keys = courseKeys();
    const remembered = store.get("tab", "");
    return routeHash() || (keys.includes(remembered) ? remembered : null) ||
      (state.data.current && keys.includes(state.data.current) ? state.data.current : null) || keys[0] || null;
  }
  function selectCourse(key) {
    if (!key || key === state.courseKey) return;
    stopAudio();
    state.courseKey = key;
    store.set("tab", key);
    revealed.clear();
    syncHash();
    render();
  }
  function selectView(view) {
    const c = course();
    if (!c || !VIEWS[c.learning] || view === viewOf(c)) return;
    stopAudio();
    state.views[c.learning] = view;
    store.set("views", state.views);
    revealed.clear();
    state.q = "";
    $("#q").value = "";
    syncHash();
    render();
    window.scrollTo({ top: 0 });
  }

  // ---- Loading ----
  async function getJSON(url) {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(r.status + " " + url);
    return r.json();
  }
  async function load() {
    const forceDemo = new URLSearchParams(location.search).has("demo");
    let data = null, failed = false;
    if (!forceDemo) {
      try { data = await getJSON("data/words.json"); } catch { failed = true; }
      try { state.status = await getJSON("status.json"); } catch { state.status = null; }
      try {
        const nb = await getJSON("data/notebooks.json");
        if (Array.isArray(nb.show) && nb.show.length) state.show = nb.show.map(String);
      } catch { state.show = null; }
    }
    if (forceDemo || (failed && location.protocol === "file:") || (failed && !location.hostname.endsWith("github.io"))) {
      try {
        data = JSON.parse($("#demoData").textContent);
        state.demo = true;
        // Sample dates are stored as "days ago" so the preview always looks current.
        const now = Date.now();
        for (const c of Object.values(data.courses)) for (const w of c.words) {
          w.added = new Date(now - w.ago * DAY).toISOString();
        }
      } catch { data = null; }
    }
    if (!data) { showLoadError(); return; }
    data.courses = data.courses || {};
    state.data = data;
    reconcilePending();
    state.courseKey = pickCourse();
    const c = course();
    lang = store.get("lang", c && c.from === "en" ? "en" : "es");
    render();
  }
  function showLoadError() {
    lang = store.get("lang", "es");
    applyChrome();
    $("#list").innerHTML = `<p class="message">${esc(t().loadError)}</p>`;
  }

  // ---- Words ----
  function firstBatch(words) {
    let min = null;
    for (const w of words) if (w.added && (min === null || w.added < min)) min = w.added;
    return min;
  }
  function isNew(w, first) {
    return w.added && w.added !== first && Date.now() - Date.parse(w.added) < 7 * DAY;
  }
  function matches(w, q) {
    if (!q) return true;
    return fold(w.text).includes(q) || fold(w.pron).includes(q) ||
      (w.translations || []).some((x) => fold(x).includes(q)) || fold(w.note).includes(q);
  }
  const dayKey = (iso) => { const d = new Date(iso); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };

  function groups(words, first, nb) {
    const out = [];
    if (state.sort === "az") {
      const sorted = [...words].sort((a, b) => a.text.localeCompare(b.text, nb.locale, { sensitivity: "base" }));
      for (const w of sorted) {
        const letter = (fold(w.text).match(/[a-z]/) || ["#"])[0].toUpperCase();
        if (!out.length || out[out.length - 1].key !== letter) out.push({ key: letter, title: letter, words: [] });
        out[out.length - 1].words.push(w);
      }
      return out;
    }
    const sorted = [...words].sort((a, b) => (b.added || "").localeCompare(a.added || "") || (b.seq || 0) - (a.seq || 0));
    const thisYear = new Date().getFullYear();
    for (const w of sorted) {
      const isFirst = w.added === first;
      const key = isFirst ? "first" : dayKey(w.added);
      if (!out.length || out[out.length - 1].key !== key) {
        const d = new Date(w.added);
        const year = d.getFullYear() !== thisYear ? { year: "numeric" } : {};
        const title = isFirst
          ? nb.until(dateFmt(nb.locale, { day: "numeric", month: "long", ...year }).format(d))
          : dateFmt(nb.locale, { weekday: "long", day: "numeric", month: "long", ...year }).format(d);
        out.push({ key, title, words: [] });
      }
      out[out.length - 1].words.push(w);
    }
    return out;
  }

  // ---- Rendering ----
  const syncUrl = () => `https://github.com/${state.status.repo}/actions/workflows/sync.yml`;
  function syncClause() {
    if (!state.status || !state.status.repo) return "";
    return ` ${esc(t().orPress)} <a href="${esc(syncUrl())}" title="${esc(t().syncTitle)}">${esc(t().syncNow)}</a>`;
  }

  function renderTabs() {
    const keys = courseKeys();
    const nav = $("#tabs");
    nav.hidden = keys.length < 2;
    if (keys.length < 2) { nav.innerHTML = ""; return; }
    nav.setAttribute("aria-label", t().notebooks);
    nav.innerHTML = keys.map((k) => {
      const c = courseInfo(k);
      const nb = notebook(c.learning);
      const sel = k === state.courseKey;
      return `<button type="button" role="tab" class="tab script-${esc(nb.script)}" data-course="${esc(k)}" aria-selected="${sel}" aria-controls="list" tabindex="${sel ? 0 : -1}" lang="${esc(c.learning)}">${esc(nb.tab)}</button>`;
    }).join("");
  }

  function applyChrome() {
    const c = course();
    const s = t();
    const nb = notebook(c ? c.learning : "fr");
    document.documentElement.lang = lang;
    document.body.classList.toggle("paper-ruled", nb.paper === "ruled");
    document.body.classList.toggle("script-br", nb.script === "br");
    $("#title").textContent = nb.title;
    $("#title").lang = c ? c.learning : "fr";
    document.title = nb.title;
    renderTabs();
    const learnName = langName(c ? c.learning : "fr");
    const fromName = langName(c ? c.from : "es");
    $("#searchLabel").textContent = s.search;
    $("#q").placeholder = s.searchPh(learnName, fromName);
    $("#sortGroup").setAttribute("aria-label", s.sort);
    $('[data-sort="recent"]').textContent = s.recent;
    $('[data-sort="az"]').textContent = s.az;
    $("#week").textContent = s.week;
    $("#quiz").textContent = s.quiz; $("#quiz").title = s.quizTitle;
    $("#slow").textContent = s.slow; $("#slow").title = s.slowTitle;
    for (const b of document.querySelectorAll("[data-sort]")) b.setAttribute("aria-pressed", String(b.dataset.sort === state.sort));
    $("#week").setAttribute("aria-pressed", String(state.week));
    $("#quiz").setAttribute("aria-pressed", String(state.quiz));
    $("#slow").setAttribute("aria-pressed", String(state.slow));
    $("#legendTitle").textContent = s.legendTitle;
    $("#legendIntro").textContent = s.legendIntro;
    $("#about").textContent = s.about;

    // Two notebooks have a second part: the class (Portuguese) and the important sentences (French).
    const parts = c ? VIEWS[c.learning] : null;
    const part = viewOf(c);
    const onAula = !!parts && part === "aula";
    const onFrases = !!parts && part === "frases";
    const views = $("#views");
    views.hidden = !parts;
    if (parts) {
      const label = { duolingo: "Duolingo", aula: "Aula", frases: s.frasesTab };
      const hadFocus = views.contains(document.activeElement); // keep it when a part finishes loading
      views.setAttribute("aria-label", s.views);
      views.innerHTML = parts.map((v) =>
        `<button type="button" role="tab" class="view" data-view="${v}" aria-selected="${part === v}" tabindex="${part === v ? 0 : -1}">${esc(label[v] || v)}</button>`).join("");
      if (hadFocus) views.querySelector('[aria-selected="true"]').focus();
    }
    document.body.classList.toggle("view-aula", onAula);
    document.body.classList.toggle("view-frases", onFrases);
    $("#sortGroup").hidden = onAula || onFrases;
    $("#week").hidden = onAula || onFrases;
    $("#secs").hidden = !(onAula || onFrases);
    $("#lessonWrap").hidden = !onAula;
    $("#stars").hidden = !onFrases;
    $("#coverGroup").hidden = !(onFrases && state.quiz);
    if (onAula) {
      $("#q").placeholder = s.aulaSearch;
      $("#quiz").title = s.aulaQuizTitle;
      $("#about").textContent = s.aulaAbout;
      $("#secs").setAttribute("aria-label", s.secsLabel);
      $("#lessonLabel").textContent = s.lessonLabel;
    }
    if (onFrases) {
      $("#q").placeholder = s.frasesSearch;
      $("#quiz").title = s.frasesQuizTitle;
      $("#about").textContent = s.frasesAbout;
      $("#secs").setAttribute("aria-label", s.situations);
      $("#stars").textContent = s.stars;
      $("#stars").title = s.starsTitle;
      $("#stars").setAttribute("aria-pressed", String(state.stars));
      $("#coverGroup").setAttribute("aria-label", s.cover);
      $("#coverLabel").textContent = s.cover;
      for (const b of document.querySelectorAll("[data-cover]")) {
        b.textContent = langName(b.dataset.cover === "fr" ? c.learning : c.from);
        b.setAttribute("aria-pressed", String(b.dataset.cover === state.cover));
      }
    }
    // Editing: the button only exists where your token is saved.
    const canEdit = !!repoName();
    if (!canEdit || !edits.token) state.editing = false;
    document.body.classList.toggle("editing", state.editing);
    $("#edit").hidden = !(canEdit && edits.token);
    $("#edit").textContent = s.edit;
    $("#edit").title = s.editTitle;
    $("#edit").setAttribute("aria-pressed", String(state.editing));
    $("#editbar").hidden = !state.editing;
    $("#editbar").textContent = touchScreen() ? s.editHintTouch : s.editHint;
    $("#editLink").hidden = !canEdit;
    $("#editLink").textContent = edits.token ? s.forgetKey : s.editLink;

    $("#langToggle").textContent = s.other;
    $("#toolsLink").textContent = s.tools;
    $("#repoLink").textContent = s.repo;
    const repo = state.status && state.status.repo;
    $("#repoLink").hidden = !repo;
    $("#syncLink").hidden = !repo;
    if (repo) {
      $("#repoLink").href = `https://github.com/${repo}`;
      $("#syncLink").href = syncUrl();
      $("#syncLink").textContent = s.syncNow;
      $("#syncLink").title = s.syncTitle;
    }
  }

  function relTime(iso) {
    const diff = (Date.parse(iso) - Date.now()) / 1000;
    const rtf = new Intl.RelativeTimeFormat(lang, { numeric: "auto" });
    const abs = Math.abs(diff);
    if (abs < 60) return rtf.format(Math.round(diff), "second");
    if (abs < 3600) return rtf.format(Math.round(diff / 60), "minute");
    if (abs < 86400) return rtf.format(Math.round(diff / 3600), "hour");
    return rtf.format(Math.round(diff / 86400), "day");
  }

  // Is the selected course the one the last sync read (the one open on Duolingo)?
  function readsThisCourse() {
    const st = state.status;
    return !st || !st.read || st.read === state.courseKey;
  }

  function renderHeader(words, first) {
    const s = t();
    const c = course();
    const wk = words.filter((w) => isNew(w, first)).length;
    const onlyFirst = words.length > 0 && words.every((w) => w.added === first);
    $("#summary").textContent = words.length
      ? s.summary(words.length, wk) + (onlyFirst ? " " + s.firstOnly : "")
      : " ";
    const st = state.status;
    const el = $("#status");
    el.hidden = true; el.className = "status"; el.textContent = "";
    if (!state.demo && st && st.checked_at) {
      if (st.ok === false && st.message) {
        el.hidden = false;
        el.classList.add("bad");
        el.innerHTML = esc(s.failed(st.message)) + (st.run_url ? ` <a href="${esc(st.run_url)}">${esc(s.seeRun)}</a>` : "");
      } else if (readsThisCourse()) {
        el.hidden = false;
        el.textContent = s.checked(relTime(st.checked_at));
      } else if (words.length) {
        el.hidden = false;
        const open = courseInfo(st.read);
        const when = c.updated || state.data.updated;
        el.innerHTML = esc((when ? s.updated(relTime(when)) + " " : "") +
          s.otherOpen(langName(open ? open.learning : st.read.split("-")[0]), langName(c.learning))) + syncClause() + ".";
      }
    }
    $("#demo").hidden = !state.demo;
    $("#demo").textContent = s.demo;
  }

  const SPEAKER = '<svg class="speaker" aria-hidden="true"><use href="#i-speaker"/></svg><svg class="bars" aria-hidden="true"><use href="#i-bars"/></svg>';

  function entryHTML(w, idx, c) {
    const s = t();
    const covered = state.quiz && !revealed.has(w.text);
    const meaning = (w.translations || []).join(", ");
    return `<li class="entry" data-i="${idx}">` +
      `<button type="button" class="play" aria-label="${esc(s.play(w.text))}">${SPEAKER}</button>` +
      `<span class="word" lang="${esc(c.learning)}">${esc(w.text)}</span>` +
      `<span class="pron${pronExtra(c.learning, w.text)}"${pronAttrs(w.text)}${w.ipa ? ` title="/${esc(w.ipa)}/"` : ""}>${esc(pendingPron(c.learning, w.text) || w.pron || "")}</span>` +
      `<span class="meaning${covered ? " covered" : ""}">` +
        `<button type="button" class="tape" aria-label="${esc(s.reveal(w.text))}"></button>` +
        `<span class="text" lang="${esc(c.from)}">${esc(meaning)}</span>` +
        (w.note ? `<span class="note">${esc(w.note)}</span>` : "") +
      `</span></li>`;
  }

  let shown = [];
  function render() {
    applyChrome();
    if (inAula()) { renderAula(); return; }
    if (inFrases()) { renderFrases(); return; }
    const c = course();
    const words = c ? c.words || [] : [];
    const first = firstBatch(words);
    renderHeader(words, first);
    renderLegend(words);
    const list = $("#list");
    shown = [];
    if (!words.length) {
      const st = state.status;
      let html;
      if (st && st.ok === false && st.message) html = esc(t().failed(st.message));
      else if (c && st && !readsThisCourse()) html = esc(t().emptyOther(langName(c.learning))) + syncClause() + ".";
      else html = esc(t().empty);
      list.innerHTML = `<p class="message">${html}</p>`;
      return;
    }
    const q = fold(state.q.trim());
    const filtered = words.filter((w) => matches(w, q) && (!state.week || isNew(w, first)));
    if (!filtered.length) {
      list.innerHTML = `<p class="message">${esc(q ? t().noMatch(state.q.trim()) : t().noWeek)}</p>`;
      return;
    }
    const nb = notebook(c.learning);
    let html = "";
    for (const g of groups(filtered, first, nb)) {
      html += `<section class="group"><h2><span class="when" lang="${esc(c.learning)}">${esc(g.title)}</span><span class="count">${esc(t().count(g.words.length))}</span></h2><ol class="entries">`;
      for (const w of g.words) { html += entryHTML(w, shown.length, c); shown.push(w); }
      html += "</ol></section>";
    }
    list.innerHTML = html;
  }

  function renderLegend(words) {
    const c = course();
    const items = LEGENDS[c && c.learning] || LEGENDS.other;
    const rows = [];
    for (const item of items) {
      let best = null;
      for (const w of words) {
        if (!w.pron) continue;
        if (item.test(w.pron, w.ipa || "") && (!best || w.text.length < best.text.length)) best = w;
      }
      if (best) rows.push(`<dt>${esc(item.sym)}</dt><dd>${esc(item[lang])} <span class="eg">${esc(best.text)} → ${esc(best.pron)}</span></dd>`);
    }
    $("#legendList").innerHTML = rows.join("");
    $("#legend").hidden = rows.length === 0;
  }

  // ---- Audio ----
  let current = null;
  function stopAudio() {
    if (current) {
      try { current.audio && current.audio.pause(); } catch { /* ignore */ }
      current.row && current.row.classList.remove("playing");
      current = null;
    }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }
  function pickVoice(tag) {
    const voices = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
    const base = tag.split("-")[0];
    return voices.find((v) => v.lang === tag) || voices.find((v) => v.lang.replace("_", "-").startsWith(base)) || null;
  }
  function speak(w, row, token) {
    if (!("speechSynthesis" in window)) { row.classList.remove("playing"); alert(t().noAudio); return; }
    const c = course();
    const tag = SPEECH_TAGS[c.learning] || c.learning;
    const u = new SpeechSynthesisUtterance(w.text);
    u.lang = tag;
    const v = pickVoice(tag);
    if (v) u.voice = v;
    u.rate = state.slow ? 0.7 : 0.95;
    const done = () => { if (current === token) { row.classList.remove("playing"); current = null; } };
    u.onend = u.onerror = done;
    // Some browsers never report the end of speech, so don't leave the row lit up forever.
    setTimeout(done, 2500 + w.text.length * (state.slow ? 220 : 150));
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }
  function play(w, row) {
    stopAudio();
    row.classList.add("playing");
    const token = { row, audio: null };
    current = token;
    let fellBack = false;
    const fallback = () => { if (fellBack || current !== token) return; fellBack = true; token.audio = null; speak(w, row, token); };
    if (w.audio) {
      const a = new Audio(w.audio);
      token.audio = a;
      a.preservesPitch = true;
      a.playbackRate = state.slow ? 0.75 : 1;
      a.onended = () => { if (current === token) { row.classList.remove("playing"); current = null; } };
      a.onerror = fallback;
      a.play().catch(fallback);
      setTimeout(() => { if (current === token && token.audio === a && a.readyState < 2) fallback(); }, 6000);
    } else {
      speak(w, row, token);
    }
  }
  if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};

  // ---- Events ----
  $("#list").addEventListener("click", (e) => {
    if (inAula()) { aulaClick(e); return; }
    if (inFrases()) { frasesClick(e); return; }
    const row = e.target.closest(".entry");
    if (!row) return;
    const w = shown[Number(row.dataset.i)];
    if (!w) return;
    if (e.target.closest(".tape")) {
      revealed.add(w.text);
      row.querySelector(".meaning").classList.remove("covered");
      return;
    }
    if (e.target.closest(".play") || e.target.closest(".word") || e.target.closest(".pron")) play(w, row);
  });
  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-course]");
    if (b) selectCourse(b.dataset.course);
  });
  $("#tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const keys = courseKeys();
    const i = keys.indexOf(state.courseKey);
    const next = keys[(i + (e.key === "ArrowRight" ? 1 : keys.length - 1)) % keys.length];
    selectCourse(next);
    const b = document.querySelector(`[data-course="${CSS.escape(next)}"]`);
    if (b) b.focus();
  });
  window.addEventListener("hashchange", () => {
    const before = JSON.stringify(state.views);
    const k = routeHash();
    if (!k) return;
    const moved = JSON.stringify(state.views) !== before;
    if (moved) store.set("views", state.views);
    if (k !== state.courseKey) selectCourse(k);
    else if (moved || inAula()) render();
  });
  $("#views").addEventListener("click", (e) => {
    const b = e.target.closest("[data-view]");
    if (b) selectView(b.dataset.view);
  });
  $("#views").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const parts = VIEWS[(course() || {}).learning];
    if (!parts) return;
    const i = parts.indexOf(viewOf(course()));
    selectView(parts[(i + (e.key === "ArrowRight" ? 1 : parts.length - 1)) % parts.length]);
    const b = document.querySelector(`[data-view="${viewOf(course())}"]`);
    if (b) b.focus();
  });
  let timer = null;
  $("#q").addEventListener("input", (e) => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value; render(); }, 90);
  });
  $("#q").addEventListener("keydown", (e) => { if (e.key === "Escape") { e.target.value = ""; state.q = ""; render(); } });
  document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || "");
    if (e.key === "/" && !typing && !e.metaKey && !e.ctrlKey) { e.preventDefault(); $("#q").focus(); }
  });
  for (const b of document.querySelectorAll("[data-sort]")) {
    b.addEventListener("click", () => { state.sort = b.dataset.sort; store.set("sort", state.sort); render(); });
  }
  $("#week").addEventListener("click", () => { state.week = !state.week; render(); });
  $("#quiz").addEventListener("click", () => { state.quiz = !state.quiz; revealed.clear(); store.set("quiz", state.quiz); render(); });
  $("#stars").addEventListener("click", () => { state.stars = !state.stars; store.set("stars", state.stars); render(); });
  for (const b of document.querySelectorAll("[data-cover]")) {
    b.addEventListener("click", () => { state.cover = b.dataset.cover; store.set("cover", state.cover); revealed.clear(); render(); });
  }
  $("#slow").addEventListener("click", () => { state.slow = !state.slow; store.set("slow", state.slow); applyChrome(); });
  $("#langToggle").addEventListener("click", () => { lang = lang === "es" ? "en" : "es"; store.set("lang", lang); render(); });

  // ===== The class notebook ("Aula"), a second part of the Portuguese notebook =====
  // data/aula.json is written by hand. scripts/aula.py builds data/aula-verbos.json
  // (every class verb in every tense) and data/aula-pron.json (Spanish-letter
  // pronunciations) from it during the sync.
  const PERSON_SHORT = ["eu", "você", "nós", "vocês"];
  const DRILL_TENSES = ["pres", "pret", "imp", "fut", "sp", "sf", "ip"];
  const aula = {
    status: "idle", data: null, verbs: [], verbMap: new Map(), tenses: [], persons: PERSON_SHORT,
    pron: {}, lessons: new Map(), tenseCard: {},
    sec: store.get("aulaSec", "vocabulario"),
    lesson: store.get("aulaLesson", ""),
    verb: store.get("aulaVerb", "fazer"),
    answers: {}, openPrompts: new Set(),
    drill: null, drillTenses: store.get("drillTenses", ["pres", "pret", "imp", "sp", "sf"]),
    drillIrr: store.get("drillIrr", false), score: { ok: 0, n: 0 },
  };
  function inAula() {
    const c = course();
    return !!c && c.learning === "pt" && viewOf(c) === "aula";
  }

  function loadAula() {
    if (aula.status === "loading" || aula.status === "ready") return;
    aula.status = "loading";
    Promise.all([
      getJSON("data/aula.json"),
      getJSON("data/aula-verbos.json").catch(() => null),
      getJSON("data/aula-pron.json").catch(() => null),
    ]).then(([d, v, p]) => {
      d.sections = (d.sections || []).filter((x) => x && x.id && Array.isArray(x.items));
      aula.data = d;
      aula.verbs = (v && Array.isArray(v.verbs)) ? v.verbs : [];
      aula.tenses = (v && Array.isArray(v.tenses)) ? v.tenses : [];
      if (v && Array.isArray(v.persons)) aula.persons = v.persons;
      aula.pron = (p && p.pron) || {};
      aula.verbMap = new Map(aula.verbs.map((x) => [x.v, x]));
      aula.lessons = new Map((d.lessons || []).map((l) => [l.id, l]));
      for (const sec of d.sections) for (const it of sec.items) if (it.tense) aula.tenseCard[it.tense] = it.id;
      if (!d.sections.some((x) => x.id === aula.sec)) aula.sec = d.sections.length ? d.sections[0].id : "";
      if (aula.lesson && !aula.lessons.has(aula.lesson)) aula.lesson = "";
      if (!aula.verbMap.has(aula.verb)) aula.verb = aula.verbMap.has("fazer") ? "fazer" : (aula.verbs[0] || {}).v;
      aula.status = "ready";
      reconcilePending();
    }).catch(() => { aula.status = "error"; })
      .then(() => { if (inAula()) { syncHash(); render(); } });
  }

  // ---- Helpers ----
  const norm = (s) => String(s ?? "").normalize("NFC").toLowerCase().replace(/[?!.…]+$/u, "").trim();
  const ARTICLE = /^(o|a|os|as|um|uma)\s+/;
  const speakable = (s) => String(s ?? "").replace(/_/g, "").replace(/…/g, "").replace(/\s+\/\s+/g, ", ").trim();
  const hit = (s, q) => fold(String(s ?? "").replace(/[*_]/g, "")).includes(q);
  let duoIndex = null, duoFrom = null;
  function duoMap() {
    const c = courseInfo(state.courseKey);
    const words = (c && c.words) || [];
    if (duoFrom !== words) {
      duoIndex = new Map();
      for (const w of words) duoIndex.set(norm(w.text), w);
      duoFrom = words;
    }
    return duoIndex;
  }
  // The same word in your Duolingo list ("o leite" finds "leite").
  function duoOf(text) {
    const map = duoMap();
    for (const part of String(text).split(" / ")) {
      const k = norm(part);
      const w = map.get(k) || map.get(k.replace(ARTICLE, ""));
      if (w) return w;
    }
    return null;
  }
  function pronOf(text) {
    const p = aula.pron[text];
    const mine = pendingPron("pt", text); // a fix you just saved that isn't published yet
    if (mine) return { pron: mine, ipa: (p && p[1]) || "" };
    if (p && p[0]) return { pron: p[0], ipa: p[1] || "" };
    const w = duoMap().get(norm(text));
    return w && w.pron ? { pron: w.pron, ipa: w.ipa || "" } : { pron: "", ipa: "" };
  }
  // Duolingo's own recording when the word is in your list, the browser's voice otherwise.
  function sayText(text, el) {
    const duo = text.includes(" / ") ? null : duoOf(text);
    play({ text: speakable(text), audio: duo && duo.audio ? duo.audio : null }, el);
  }
  // *texto* is Portuguese you can tap to hear; _texto_ is written in red pen.
  function md(text) {
    let h = esc(text);
    h = h.replace(/\*([^*]+)\*/g, (m, inner) => `<span class="pt say" lang="pt" data-say="${inner.replace(/_/g, "")}">${inner}</span>`);
    h = h.replace(/_([^_]+)_/g, '<b class="red">$1</b>');
    return h.replace(/\n/g, "<br>");
  }
  const textCache = new WeakMap();
  function textOf(item) {
    if (textCache.has(item)) return textCache.get(item);
    const out = [];
    const walk = (x, key) => {
      if (typeof x === "string") { if (!["id", "tense", "kind", "lesson"].includes(key)) out.push(x); }
      else if (Array.isArray(x)) x.forEach((y) => walk(y, key));
      else if (x && typeof x === "object") for (const [k, v] of Object.entries(x)) if (k !== "lessons") walk(v, k);
    };
    walk(item, "");
    const s = fold(out.join(" ").replace(/[*_]/g, ""));
    textCache.set(item, s);
    return s;
  }
  const lessonName = (id) => (aula.lessons.get(id) || { name: id }).name;
  function findItem(id) {
    for (const sec of aula.data.sections) for (const it of sec.items) if (it.id === id) return it;
    return null;
  }

  // ---- Pieces of a page ----
  function tagsHTML(ids) {
    const s = t();
    const known = [...aula.lessons.keys()].filter((k) => (ids || []).includes(k));
    if (!known.length) return "";
    const days = [], lessons = [], other = [];
    for (const id of known) {
      const name = lessonName(id);
      let m;
      if ((m = name.match(/^Dia (\d+)$/))) days.push([id, m[1]]);
      else if ((m = name.match(/^Liç(?:ão|ões) (.+)$/))) lessons.push([id, m[1]]);
      else other.push([id, name]);
    }
    const btn = (id, label) => `<button type="button" data-lesson="${esc(id)}" title="${esc(s.onlyLesson(lessonName(id)))}">${esc(label)}</button>`;
    const parts = [];
    if (days.length) parts.push((days.length > 1 ? "Dias " : "Dia ") + days.map(([id, n]) => btn(id, n)).join(", "));
    if (lessons.length) parts.push((lessons.length > 1 || / e /.test(lessons[0][1]) ? "Lições " : "Lição ") + lessons.map(([id, n]) => btn(id, n)).join(", "));
    for (const [id, name] of other) parts.push(btn(id, name));
    return `<span class="tags">${parts.join(" · ")}</span>`;
  }
  function headHTML(item, extra = "") {
    return `<h2 id="i-${esc(item.id)}"><span class="when" lang="pt">${esc(item.title)}</span>${extra}${tagsHTML(item.lessons)}</h2>`;
  }
  function wordHTML(row, key) {
    const [pt, es, note] = row;
    const s = t();
    const k = "a:" + key;
    const covered = state.quiz && !revealed.has(k);
    const { pron, ipa } = pronOf(pt);
    const duo = duoOf(pt);
    return `<li class="entry say" data-say="${esc(pt)}">` +
      `<button type="button" class="play" aria-label="${esc(s.play(speakable(pt)))}">${SPEAKER}</button>` +
      `<span class="word" lang="pt">${esc(pt)}${duo ? `<span class="duo" title="${esc(s.inDuo)}" aria-label="${esc(s.inDuo)}">✓</span>` : ""}</span>` +
      `<span class="pron${pronExtra("pt", pt)}"${pronAttrs(pt)}${ipa ? ` title="/${esc(ipa)}/"` : ""}>${esc(pron)}</span>` +
      `<span class="meaning${covered ? " covered" : ""}">` +
        `<button type="button" class="tape" data-k="${esc(k)}" aria-label="${esc(s.reveal(speakable(pt)))}"></button>` +
        `<span class="text" lang="es">${esc(es)}</span>` +
        (note ? `<span class="note">${md(note)}</span>` : "") +
      `</span></li>`;
  }
  function wordsHTML(rows, prefix) {
    return `<ol class="entries">${rows.map((r, i) => wordHTML(r, `${prefix}:${i}`)).join("")}</ol>`;
  }
  function exHTML(rows) {
    return `<ol class="entries exs">` + rows.map(([pt, es]) =>
      `<li class="entry ex say" data-say="${esc(speakable(pt))}">` +
      `<button type="button" class="play" aria-label="${esc(t().play(speakable(pt)))}">${SPEAKER}</button>` +
      `<span class="word" lang="pt">${md(pt)}</span><span class="meaning" lang="es">${esc(es)}</span></li>`).join("") + `</ol>`;
  }
  // Mark the ending of a model verb in red: fal|ei, vou| falar.
  function endingSplit(v, tense, form) {
    const sp = form.indexOf(" ");
    if (sp > 0) return `<b class="red">${esc(form.slice(0, sp))}</b>${esc(form.slice(sp))}`;
    const inf = v.v.replace(/-se$/, "");
    let stem = inf.slice(0, -2);
    if (tense === "fut" || tense === "ip") stem = inf;
    else if (tense === "sf") stem = ((v.t.pret || [])[3] || "").slice(0, -3);
    let i = 0;
    while (i < stem.length && i < form.length && form[i] === stem[i]) i++;
    if (i >= form.length) return esc(form);
    return esc(form.slice(0, i)) + `<b class="red">${esc(form.slice(i))}</b>`;
  }
  function cellHTML(v, tense, p, mode) {
    const form = ((v.t || {})[tense] || [])[p] || "";
    const k = `a:f:${v.v}:${tense}:${p}`;
    const covered = state.quiz && !revealed.has(k);
    const irr = !!(v.x && v.x[tense] && v.x[tense][p]);
    const inner = mode === "end" ? endingSplit(v, tense, form) : irr ? `<b class="red">${esc(form)}</b>` : esc(form);
    const { pron, ipa } = pronOf(form);
    return `<span class="fc${covered ? " covered" : ""}" data-p="${esc(PERSON_SHORT[p])}"><span class="fw">` +
      `<span class="form say" lang="pt" data-say="${esc(form)}">${inner}</span>` +
      (pron ? `<span class="fp"${ipa ? ` title="/${esc(ipa)}/"` : ""}>${esc(pron)}</span>` : "") +
      `</span><button type="button" class="tape" data-k="${esc(k)}" aria-label="${esc(t().revealForm)}"></button></span>`;
  }
  const personHTML = (p) => `<span class="cp"><span class="long">${esc(aula.persons[p] || PERSON_SHORT[p])}</span><span class="short">${esc(PERSON_SHORT[p])}</span></span>`;
  const verbLink = (v) => `<button type="button" class="vlink" data-verb="${esc(v.v)}" lang="pt">${esc(v.v)}</button>`;
  function conjHTML({ tense, verbs }) {
    const vs = (verbs || []).map((x) => aula.verbMap.get(x)).filter(Boolean);
    if (!vs.length) return "";
    let h = `<div class="conj" style="--cols:${vs.length}"><span class="ch"></span>` + vs.map((v) => `<span class="ch">${verbLink(v)}</span>`).join("");
    for (let p = 0; p < 4; p++) h += personHTML(p) + vs.map((v) => cellHTML(v, tense, p, "end")).join("");
    return h + `</div>`;
  }
  function formsHTML({ tense, verbs }) {
    const vs = (verbs || []).map((x) => aula.verbMap.get(x)).filter(Boolean);
    if (!vs.length) return "";
    let h = `<div class="forms"><span class="fh"></span>` + PERSON_SHORT.map((p) => `<span class="fh">${esc(p)}</span>`).join("");
    for (const v of vs) {
      h += `<span class="fv">${verbLink(v)} <span class="fes">${esc(String(v.es).split(/[;,(]/)[0].trim())}</span></span>`;
      for (let p = 0; p < 4; p++) h += cellHTML(v, tense, p, "irr");
    }
    return h + `</div>`;
  }
  function rulesHTML(rows) {
    return `<dl class="rules">` + rows.map(([label, expl, pt, es]) =>
      `<dt>${esc(label)}</dt><dd>` +
      (expl ? `<span class="rexp">${md(expl)}</span>` : "") +
      (pt ? `<span class="rx say" lang="pt" data-say="${esc(speakable(pt))}"><span class="rpt">${md(pt)}</span> <span class="res" lang="es">${esc(es || "")}</span></span>` : "") +
      `</dd>`).join("") + `</dl>`;
  }
  function vsHTML(rows, fromSpanish) {
    return `<ul class="vs${fromSpanish ? " es" : ""}">` + rows.map(([wrong, right, why]) =>
      `<li><span class="wrong" lang="${fromSpanish ? "es" : "pt"}">${esc(wrong)}</span>` +
      `<span class="right say" lang="pt" data-say="${esc(speakable(right))}">${esc(right)}</span>` +
      (why ? `<span class="why">${md(why)}</span>` : "") + `</li>`).join("") + `</ul>`;
  }
  function tableHTML({ head, rows, pt }) {
    const isPt = (i) => (pt || []).includes(i);
    const cell = (c, i, tag) => (isPt(i) && c)
      ? `<${tag}><span class="say" lang="pt" data-say="${esc(speakable(c))}">${esc(c)}</span></${tag}>`
      : `<${tag}>${esc(c)}</${tag}>`;
    return `<div class="tblwrap"><table class="tbl">` +
      (head ? `<thead><tr>${head.map((c) => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead>` : "") +
      `<tbody>${rows.map((r) => `<tr>${r.map((c, i) => cell(c, i, i === 0 ? "th" : "td")).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function timelineHTML({ bg, ev, es }) {
    let wave = "M24 34 q 8 -10 16 0";
    for (let i = 0; i < 22; i++) wave += " t 16 0";
    const s = t();
    return `<div class="tl"><svg viewBox="0 0 640 64" preserveAspectRatio="none" aria-hidden="true">` +
      `<line class="tl-axis" x1="0" y1="34" x2="640" y2="34"/><path class="tl-wave" d="${wave}"/><line class="tl-tick" x1="300" y1="10" x2="300" y2="58"/></svg>` +
      `<p class="say" lang="pt" data-say="${esc(bg + " " + ev)}"><span class="tl-bg">${esc(bg)}</span> <span class="tl-ev">${esc(ev)}</span></p>` +
      `<p class="tl-es">${esc(es)}</p>` +
      `<p class="tl-key"><span class="k-imp">imperfeito</span>: ${esc(s.tlImp)} · <span class="k-pret">pretérito</span>: ${esc(s.tlPret)}</p></div>`;
  }
  function quoteHTML({ pt, es, by }) {
    return `<blockquote class="quote"><p class="qpt say" lang="pt" data-say="${esc(pt.replace(/\n/g, " "))}">${esc(pt).replace(/\n/g, "<br>")}</p>` +
      `<p class="qes">${esc(es)}</p><p class="qby">${esc(by)}</p></blockquote>`;
  }
  function soundsHTML(rows) {
    return `<dl class="sounds">` + rows.map(([label, expl, words]) =>
      `<dt>${esc(label)}</dt><dd><span class="rexp">${md(expl)}</span><span class="sws">` +
      (words || []).map((w) => {
        const { pron, ipa } = pronOf(w);
        return `<span class="sw say" lang="pt" data-say="${esc(w)}"><span class="pt">${esc(w)}</span>${pron ? ` <span class="fp"${ipa ? ` title="/${esc(ipa)}/"` : ""}>${esc(pron)}</span>` : ""}</span>`;
      }).join("") + `</span></dd>`).join("") + `</dl>`;
  }
  function patternsHTML(rows) {
    return `<dl class="sounds">` + rows.map(([label, expl, pairs]) =>
      `<dt>${esc(label)}</dt><dd>${expl ? `<span class="rexp">${md(expl)}</span>` : ""}<span class="sws">` +
      (pairs || []).map(([es, pt]) => `<span class="sw say" lang="pt" data-say="${esc(pt)}"><span class="pes" lang="es">${esc(es)}</span> → <span class="pt">${esc(pt)}</span></span>`).join("") +
      `</span></dd>`).join("") + `</dl>`;
  }
  function blocksHTML(item) {
    let h = "";
    if (item.aka) h += `<p class="aka">= ${esc(item.aka)}</p>`;
    if (item.use) h += `<p class="use">${md(item.use)}</p>`;
    (item.blocks || []).forEach((b, bi) => {
      if (b.p) h += `<p class="blk">${md(b.p)}</p>`;
      else if (b.h) h += `<h3 class="blk-h">${esc(b.h)}</h3>`;
      else if (b.ojo) h += `<p class="ojo">${md(b.ojo)}</p>`;
      else if (b.ex) h += exHTML(b.ex);
      else if (b.words) h += wordsHTML(b.words, `${item.id}:b${bi}`);
      else if (b.conj) h += conjHTML(b.conj);
      else if (b.forms) h += formsHTML(b.forms);
      else if (b.rules) h += rulesHTML(b.rules);
      else if (b.vs) h += vsHTML(b.vs, b.es);
      else if (b.table) h += tableHTML(b.table);
      else if (b.timeline) h += timelineHTML(b.timeline);
      else if (b.quote) h += quoteHTML(b.quote);
      else if (b.sounds) h += soundsHTML(b.sounds);
      else if (b.patterns) h += patternsHTML(b.patterns);
    });
    return h;
  }

  // ---- Items ----
  function wordGroupHTML(item, f) {
    const titleHit = f.q && hit(item.title, f.q);
    const rows = item.words.map((r, i) => [r, i]).filter(([r]) => !f.q || titleHit || hit(r.join(" "), f.q));
    if (!rows.length) return "";
    return `<section class="group card">${headHTML(item)}` +
      (item.use ? `<p class="use">${md(item.use)}</p>` : "") +
      (item.note ? `<p class="gnote">${md(item.note)}</p>` : "") +
      `<ol class="entries">${rows.map(([r, i]) => wordHTML(r, `${item.id}:${i}`)).join("")}</ol></section>`;
  }
  function conversaHTML(item, f) {
    const s = t();
    const ps = item.prompts.filter((p) => (!f.lesson || p.lesson === f.lesson) &&
      (!f.q || hit([p.q, p.a, p.es, p.uses].join(" "), f.q)));
    if (!ps.length) return "";
    return `<section class="group card">${headHTML(item)}${item.use ? `<p class="use">${md(item.use)}</p>` : ""}<ol class="prompts">` +
      ps.map((p) => {
        const k = `${item.id}:${p.lesson}`;
        const open = aula.openPrompts.has(k);
        return `<li class="prompt"><button type="button" class="play" data-say="${esc(p.q)}" aria-label="${esc(s.play(p.q))}">${SPEAKER}</button>` +
          `<span class="pl">${esc(lessonName(p.lesson))}</span> <span class="pq say" lang="pt" data-say="${esc(p.q)}">${esc(p.q)}</span> ` +
          `<button type="button" class="link" data-reveal="${esc(k)}" aria-expanded="${open}">${esc(open ? s.hideEx : s.showEx)}</button>` +
          `<div class="pa"${open ? "" : " hidden"}><span class="pat say" lang="pt" data-say="${esc(p.a)}">${esc(p.a)}</span> ` +
          `<span class="pes" lang="es">${esc(p.es)}</span>${p.uses ? ` <span class="puses">${esc(s.practices(p.uses))}</span>` : ""}</div></li>`;
      }).join("") + `</ol></section>`;
  }

  // ---- Practice sets ----
  const cleanAnswer = (s) => String(s ?? "").normalize("NFC").toLowerCase().replace(/\s+/g, " ").trim();
  function grade(typed, answers) {
    const tv = cleanAnswer(typed);
    const list = [].concat(answers).map(cleanAnswer);
    if (list.includes(tv)) return { ok: true };
    if (list.some((x) => fold(x) === fold(tv))) return { ok: false, almost: true };
    return { ok: false };
  }
  function fbHTML(item, q, a) {
    if (!a) return "";
    const s = t();
    const correct = item.kind === "type" ? [].concat(q[2])[0] : q[1][q[2]];
    const why = q[3];
    const msg = a.ok ? s.right : a.almost ? s.almost(correct) : s.wrongWas(correct);
